<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRM SolvIA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f0f10%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Inter%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* surfaces */
  --bg:#ffffff;
  --bg-sub:#fafafa;
  --surface:#ffffff;
  --surface-2:#f6f7f8;
  --hover:#f6f7f8;
  --selected:#eef0f4;

  /* traits */
  --line:#ebebee;
  --line-strong:#dedee3;

  /* encre */
  --ink:#0f0f10;
  --ink-2:#5c5f66;
  --ink-3:#8f939c;

  /* action */
  --btn:#0f0f10;
  --btn-ink:#ffffff;
  --focus:#8a8f99;

  /* sémantique : engagement */
  --eng:#3549a5;      --eng-bg:#eef1fb;
  /* sémantique : statuts */
  --rappel:#8a6100;   --rappel-bg:#fdf4e0;
  --rdv:#166b40;      --rdv-bg:#e7f4ec;
  --non:#a83228;      --non-bg:#fceeec;
  --inj:#55565c;      --inj-bg:#f1f1f3;
  --neutral:#6b6f78;  --neutral-bg:#f2f3f5;

  --link:#2b5bd7;

  /* rayons — parti pris carré */
  --r-sm:3px; --r:4px; --r-md:5px; --r-lg:6px;

  /* typo */
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* ombres — nettes, quasi absentes */
  --sh-1:none;
  --sh-2:0 24px 60px -24px rgba(15,15,16,.34);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.5;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--link);text-decoration:none}
input,textarea{font:inherit}
::selection{background:#dfe3ee}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.label{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
/* Chiffres, dates et codes en mono */
.tnum,.rating .v,.rating .n,.dep,.opened .dt,.navitem .ct,.rec-pos,.pager,.cal-num,.cal-ev .h,.cal-n{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}

/* ============================================================
   LOGIN
   ============================================================ */
.login{position:fixed;inset:0;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
.login .card{width:100%;max-width:352px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:32px}
.login .mark{width:36px;height:36px;border-radius:var(--r-md);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:20px}
.login h1{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.login p{margin:0 0 20px;color:var(--ink-3);font-size:13px}
.login input{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);outline:none;transition:border-color .12s}
.login input:focus{border-color:var(--focus)}
.login .err{color:var(--non);font-size:12.5px;min-height:18px;padding:6px 0 4px}
.login button{width:100%;padding:11px;border-radius:var(--r);background:var(--btn);color:var(--btn-ink);font-weight:600}
.login button:hover{opacity:.88}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:242px minmax(0,1fr);height:100vh}

/* --- Sidebar --- */
.side{
  background:var(--bg-sub);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px 12px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.brand .mark{width:24px;height:24px;border-radius:var(--r-sm);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.brand .txt{line-height:1.25}
.brand .n{font-weight:600;font-size:14px}
.brand .s{color:var(--ink-3);font-size:11.5px}

.navgroup{margin-bottom:22px}
.navgroup > .label{padding:0 10px 7px}
.nav{display:flex;flex-direction:column;gap:1px}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--r);color:var(--ink-2);font-weight:450;font-size:13.5px;
  transition:background .1s,color .1s;
}
.navitem:hover{background:#f0f0f2;color:var(--ink)}
.navitem[aria-current="true"]{background:var(--selected);color:var(--ink);font-weight:600}
/* modes (Liste / Calendrier) : icône */
.navitem .ic{width:15px;height:15px;flex:none;color:var(--ink-3)}
.navitem .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navitem[aria-current="true"] .ic{color:var(--ink)}
/* filtres : pastille de couleur */
.navitem .dot{width:6px;height:6px;border-radius:2px;flex:none;background:var(--line-strong);margin:0 4px}
.navitem[aria-current="true"] .dot{background:var(--ink-3)}
.navitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .ct{font-size:11.5px;color:var(--ink-3);font-weight:500}
.navitem[aria-current="true"] .ct{color:var(--ink-2)}
.d-eng{background:var(--eng)!important}
.d-rappel{background:var(--rappel)!important}
.d-rdv{background:var(--rdv)!important}
.d-non{background:var(--non)!important}
.d-inj{background:var(--inj)!important}

.side-foot{margin-top:auto;padding:14px 9px 2px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;line-height:1.7}
.side-foot button{color:var(--ink-3);text-decoration:underline;font-size:12px;padding:0}
.side-foot button:hover{color:var(--ink-2)}

/* --- Main --- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  flex:none;display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;border-bottom:1px solid var(--line);
}
.topbar h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.topbar .cnt{color:var(--ink-3);font-weight:450;font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.search{
  margin-left:auto;flex:1;max-width:340px;display:flex;align-items:center;gap:8px;
  height:34px;padding:0 12px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);
  transition:background .12s,border-color .12s;
}
.search:focus-within{background:var(--surface);border-color:var(--focus)}
.search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.9;flex:none}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}

.scroll{flex:1;overflow-y:auto}
.content{padding:8px 24px 64px}

/* --- Barre de filtres --- */
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 12px 12px}
.ctrl{position:relative;display:inline-flex;align-items:center}
.ctrl select{
  appearance:none;-webkit-appearance:none;
  padding:6px 28px 6px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;
  cursor:pointer;outline:none;transition:background .1s,border-color .1s;
}
.ctrl select:hover{background:var(--hover)}
.ctrl select:focus{border-color:var(--focus)}
.ctrl.active select{background:var(--selected);border-color:var(--line-strong);font-weight:600}
.ctrl .chev{
  position:absolute;right:9px;pointer-events:none;color:var(--ink-3);
  width:12px;height:12px;
}
.ctrl .chev svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctrl .k{font-size:11.5px;color:var(--ink-3);margin-right:6px;white-space:nowrap}
.clearf{
  padding:6px 10px;border-radius:var(--r);border:1px solid transparent;
  color:var(--ink-3);font-size:12.5px;font-weight:500;
}
.clearf:hover{background:var(--hover);color:var(--ink-2)}

/* --- Tri multi-niveaux (panneau) --- */
.filters{position:relative}
.trigbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;
  transition:background .1s,border-color .1s;
}
.trigbtn:hover{background:var(--hover)}
.trigbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.trigbtn.active{background:var(--selected);font-weight:600}
.trigbtn .n{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  min-width:15px;height:15px;padding:0 3px;border-radius:var(--r-sm);
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
}

.pop{
  position:absolute;top:calc(100% - 4px);left:12px;z-index:60;
  width:534px;max-width:calc(100vw - 32px);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -18px rgba(15,15,16,.30);
  padding:12px;
}
.pop .poph{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 10px;margin-bottom:10px;border-bottom:1px solid var(--line);
}
.pop .poph .t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pop .poph button{color:var(--ink-3);font-size:12px;padding:2px 6px;border-radius:var(--r-sm)}
.pop .poph button:hover{background:var(--hover);color:var(--ink-2)}

.sortrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sortrow .rk{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:16px;flex:none;text-align:center}
.sortrow select{
  appearance:none;-webkit-appearance:none;
  height:30px;padding:0 24px 0 9px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;outline:none;
}
.sortrow select:hover{background:var(--hover)}
.sortrow select:focus{border-color:var(--focus)}
.sortrow .f{flex:1;min-width:0}
.sortrow .d{flex:none;width:176px}
.sortrow .wrap{position:relative;display:flex;align-items:center}
.sortrow .wrap select{width:100%}
.sortrow .wrap .chev{position:absolute;right:8px;pointer-events:none;color:var(--ink-3);width:11px;height:11px}
.sortrow .wrap .chev svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{
  width:28px;height:28px;flex:none;border-radius:var(--r);color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.22;pointer-events:none}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pop .addsort{
  display:inline-flex;align-items:center;gap:7px;margin-top:4px;
  padding:6px 9px;border-radius:var(--r);color:var(--ink-2);font-size:12.5px;font-weight:500;
}
.pop .addsort:hover{background:var(--hover);color:var(--ink)}
.pop .addsort svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pop .hint{padding:8px 2px 2px;margin-top:6px;border-top:1px solid var(--line);color:var(--ink-3);font-size:11.5px;line-height:1.5}
.pop .empty-sort{padding:2px 2px 8px;color:var(--ink-3);font-size:12.5px}

@media (max-width:640px){
  .pop{width:auto;left:12px;right:12px}
  .sortrow{flex-wrap:wrap}
  .sortrow .d{width:100%}
}

/* ============================================================
   TABLE
   ============================================================ */
.thead,.trow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 104px 148px 152px;
  align-items:center;gap:20px;padding:0 12px;
}
.thead{height:34px;border-bottom:1px solid var(--line-strong);position:sticky;top:0;background:var(--bg);z-index:2}
.thead > div{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.trow{
  min-height:62px;border-bottom:1px solid var(--line);
  border-radius:var(--r);transition:background .1s;
}
.trow:hover{background:var(--hover)}

.c-name{display:flex;align-items:center;gap:12px;min-width:0}
.mono{
  position:relative;overflow:hidden;
  width:32px;height:32px;flex:none;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:650;letter-spacing:.01em;
}
.mono.eng{background:var(--eng-bg);color:var(--eng)}
/* Favicon de l'établissement : recouvre les initiales quand il charge,
   disparaît (onerror) et laisse les initiales sinon. */
.mono .fav{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;padding:5px;background:#fff;
  box-shadow:inset 0 0 0 1px var(--line);border-radius:inherit;
}
.mono.eng .fav{box-shadow:inset 0 0 0 1px var(--eng-bg)}
.c-name .txt{min-width:0}
.c-name .t1{font-weight:600;font-size:14px;letter-spacing:-.011em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name .t2{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--ink-3);font-size:12.5px;overflow:hidden;white-space:nowrap}
.c-name .t2 .sep{opacity:.5}
.cbchip{
  flex:none;display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:5px;
  font-size:11px;font-weight:600;background:var(--rappel-bg);color:var(--rappel);
}
.cbchip.retard{background:var(--non-bg);color:var(--non)}
.cbchip.futur{background:var(--surface-2);color:var(--ink-2)}
.inp{
  width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:13.5px;outline:none;transition:border-color .12s;
}
.inp:focus{border-color:var(--focus)}
.hintline{margin-top:6px;font-size:12px;color:var(--ink-3)}
.corrige{display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;background:var(--rdv-bg);color:var(--rdv);font-size:10.5px;font-weight:600;margin-left:6px}
.dep{
  flex:none;padding:1px 5px;border-radius:var(--r-sm);background:var(--surface-2);
  color:var(--ink-2);font-size:10.5px;font-weight:500;border:1px solid var(--line);
}

.rating{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.rating .v{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.rating .n{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

.opened{display:flex;align-items:center;gap:7px;white-space:nowrap}
.opened .pt{width:6px;height:6px;border-radius:50%;background:var(--eng);flex:none}
.opened .dt{color:var(--eng);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;white-space:nowrap;
  background:var(--neutral-bg);color:var(--neutral);
}
.pill .pd{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill[data-s="rappel"]{background:var(--rappel-bg);color:var(--rappel)}
.pill[data-s="rdv"]{background:var(--rdv-bg);color:var(--rdv)}
.pill[data-s="non"]{background:var(--non-bg);color:var(--non)}
.pill[data-s="injoignable"]{background:var(--inj-bg);color:var(--inj)}

.empty{padding:72px 0;text-align:center;color:var(--ink-3)}
.empty .big{font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:4px}

.pager{display:flex;align-items:center;justify-content:space-between;padding:18px 12px 0;color:var(--ink-3);font-size:12.5px}
.pager .grp{display:flex;gap:8px}
.pager button{padding:7px 13px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font-weight:500;font-size:13px}
.pager button:hover:not(:disabled){background:var(--hover)}
.pager button:disabled{opacity:.4;cursor:default}

/* ============================================================
   RECORD (plein écran)
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;gap:20px;padding:32px 20px;
  background:rgba(15,15,16,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.overlay.open{display:flex}

/* Grandes flèches latérales, hors du panneau */
.sidearrow{
  flex:none;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px -4px rgba(15,15,16,.45);transition:transform .12s,opacity .12s;
}
.sidearrow:hover:not(:disabled){transform:scale(1.07)}
.sidearrow:disabled{opacity:.28;cursor:default}
.sidearrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.record{
  width:100%;max-width:920px;height:100%;max-height:100%;
  background:var(--surface);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--sh-2);
  animation:rise .16s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}

.rec-bar{
  flex:none;display:flex;align-items:center;gap:8px;height:54px;
  padding:0 20px;border-bottom:1px solid var(--line);
}
.iconbtn{
  width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .1s,color .1s;
}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rec-pos{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-left:4px}
.rec-bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-variant-numeric:tabular-nums}

.rec-scroll{flex:1;overflow-y:auto}
.rec-inner{max-width:760px;margin:0 auto;padding:32px 28px 80px}

/* identité */
.hero{display:flex;align-items:flex-start;gap:16px}
.hero .mono{width:52px;height:52px;border-radius:var(--r-md);font-size:17px}
.hero .h-txt{min-width:0;flex:1}
.hero h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.hero .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;color:var(--ink-2);font-size:13px}
.hero .meta .sep{color:var(--ink-3);opacity:.6}
.hero .pill{margin-top:0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{
  display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:var(--r-sm);
  font-size:12px;font-weight:600;background:var(--eng-bg);color:var(--eng);
}
.badge .pt{width:6px;height:6px;border-radius:50%;background:currentColor}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);

  font-size:13px;font-weight:500;transition:background .1s;
}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.88;background:var(--btn)}
.btn.danger{color:var(--non);border-color:var(--non-bg);background:var(--non-bg)}
.btn.danger:hover{background:#f9e2de}

/* sections */

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px}

.field{min-width:0}
.field .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:4px}
.field .v{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.field .v .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{
  width:26px;height:26px;flex:none;border-radius:var(--r-sm);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);opacity:0;transition:opacity .12s,color .1s;
}
.field:hover .copy{opacity:1}
.copy:hover{color:var(--ink);background:var(--hover)}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.desc{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65}

/* suivi */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.segbtn{
  padding:8px 14px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;transition:.1s;
}
.segbtn:hover{background:var(--hover);color:var(--ink)}
.segbtn[aria-pressed="true"]{font-weight:600;border-color:transparent}
.segbtn[aria-pressed="true"][data-s="rappel"]{background:var(--rappel-bg);color:var(--rappel)}
.segbtn[aria-pressed="true"][data-s="rdv"]{background:var(--rdv-bg);color:var(--rdv)}
.segbtn[aria-pressed="true"][data-s="non"]{background:var(--non-bg);color:var(--non)}
.segbtn[aria-pressed="true"][data-s="injoignable"]{background:var(--inj-bg);color:var(--inj)}

textarea.notes{
  width:100%;min-height:132px;resize:vertical;padding:12px 14px;
  border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);

.linkbtn.sync{color:var(--ink-3);font-size:12px}

}

.mailitem.reply .tag{background:var(--rdv-bg);color:var(--rdv)}

.mailitem.open .bodytxt.long::after{display:none}
.mailitem .more{margin-top:7px;color:var(--link);font-size:12.5px;font-weight:500;padding:0}
.mailitem .more:hover{text-decoration:underline}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:var(--r-md);

}

/* ============================================================
   CALENDRIER
   ============================================================ */
.cal-bar{display:flex;align-items:center;gap:10px;padding:12px 12px 16px}

.cal-cell.today{background:#fbfaf5}

.dtin:focus{border-color:var(--focus)}

  .hero h1{font-size:21px}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
/* Mots trop génériques pour identifier un établissement : on les écarte
   pour que le monogramme porte le nom distinctif (Hôtel Le Grand Aigle -> GA). */
var STOP=("hotel hostellerie auberge logis relais residence appart apparthotel motel "+
  "chambre chambres maison maisons hote hotes domaine chateau manoir mas villa bastide "+
  "camping gite gites restaurant brasserie spa resort le la les l un une du de des d au aux "+
  "a et en sur sous the and by").split(" ");
function initials(n){
  var raw=String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^A-Za-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);
  if(!raw.length) return "?";
  var w=raw.filter(function(x){return STOP.indexOf(x.toLowerCase())<0;});
  if(!w.length) w=raw;
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function mailOf(r){return (r.crm_email&&r.crm_email.trim())||r.email_primary||"";}
function gcalUrl(r){
  var titre="RDV SolvIA · "+(r.hotel_name||"");
  var detail=[
    "Rendez-vous de présentation du livret d'accueil digital.",
    r.phone_primary?("Téléphone : "+r.phone_primary):"",
    (r.crm_email||r.email_primary)?("Email : "+(r.crm_email||r.email_primary)):"",
    r.guidebook_slug?("Guidebook : https://guide.solvia.pro/?slug="+r.guidebook_slug):"",
    "Fiche CRM : https://guide.solvia.pro/crm/",
    r.crm_notes?("\nNotes : "+r.crm_notes):""
  ].filter(Boolean).join("\n");
  var lieu=[r.hotel_name,r.city,r.departement_code?("("+r.departement_code+")"):""].filter(Boolean).join(" ");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(titre)+
    "&dates="+encodeURIComponent((r.meeting_utc||"")+"/"+(r.meeting_utc_end||""))+
    "&details="+encodeURIComponent(detail)+
    "&location="+encodeURIComponent(lieu);
}
function stars(hc){var m=String(hc||"").match(/(\d)/);return m?m[1]:"";}
/* Pastille : favicon du site de l'hôtel, initiales en repli. */
function avatar(r,cls){
  var eng=r.opens>0;
  var img=r.favicon_url
    ? '<img class="fav" src="'+esc(r.favicon_url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">'
    : '';
  return '<div class="mono'+(eng?' eng':'')+(cls?(' '+cls):'')+'">'+esc(initials(r.hotel_name))+img+'</div>';
}
function telHref(p){return "tel:"+String(p||"").replace(/[^+0-9]/g,"");}
function guideHref(slug){return "https://guide.solvia.pro/?slug="+encodeURIComponent(slug)+"&nc=1";}
function mapsHref(r){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((r.hotel_name||"")+" "+(r.city||""));}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1700);}
function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(msg||"Copié");},function(){toast("Copie impossible");});
  } else toast("Copie non supportée");
}
function api(payload){
  payload.key=KEY;
  return fetch(FN,{method:"POST",headers:{"content-type":"application/json","apikey":ANON,"authorization":"Bearer "+ANON},body:JSON.stringify(payload)})
    .then(function(r){
      if(r.status===401) throw {auth:true};
      return r.json().then(function(j){ if(!r.ok) throw ((j&&j.error)||("HTTP "+r.status)); return j; });
    });
}

function load(){

function renderNav(){

var CHEV='<span class="chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';
var ICSORT='<svg viewBox="0 0 24 24"><path d="M4 7h11"/><path d="M4 12h7"/><path d="M4 17h4"/><path d="M17 5v14"/><path d="M14 16l3 3 3-3"/></svg>';
var ICUP  ='<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>';
var ICDOWN='<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>';
var ICX   ='<svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>';
var ICPLUS='<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';

/* Résumé lisible du tri courant, affiché sur le bouton. */
function sortSummary(list){
  if(!list.length) return "Trier";
  if(list.length===1) return SORT_NAME[list[0].f]||"Trier";
  return "Trié par "+list.length+" champs";
}

/* Une ligne de règle : rang, champ, sens, monter/descendre, supprimer. */
function sortRowHtml(r,i,list){
  var type=SORT_TYPE[r.f]||"text", lab=DIR_LABEL[type]||DIR_LABEL.text;

  var fieldOpts=SORT_FIELDS.map(function(f){
    var taken=false;
    for(var j=0;j<list.length;j++) if(j!==i&&list[j].f===f[0]){taken=true;break;}
    return '<option value="'+f[0]+'"'+(r.f===f[0]?' selected':'')+(taken?' disabled':'')+'>'+esc(f[1])+'</option>';
  }).join("");

  var dirOpts='<option value="asc"'+(r.d==="asc"?' selected':'')+'>'+esc(lab[0])+'</option>'+
              '<option value="desc"'+(r.d!=="asc"?' selected':'')+'>'+esc(lab[1])+'</option>';

  return '<div class="sortrow" data-rule="'+i+'">'+
    '<span class="rk">'+(i+1)+'</span>'+
    '<span class="wrap f"><select data-sfield="'+i+'" aria-label="Champ de tri '+(i+1)+'">'+fieldOpts+'</select>'+CHEV+'</span>'+
    '<span class="wrap d"><select data-sdir="'+i+'" aria-label="Sens du tri '+(i+1)+'">'+dirOpts+'</select>'+CHEV+'</span>'+
    '<button class="iconbtn" data-sup="'+i+'" title="Monter"'+(i===0?' disabled':'')+' aria-label="Monter">'+ICUP+'</button>'+
    '<button class="iconbtn" data-sdown="'+i+'" title="Descendre"'+(i===list.length-1?' disabled':'')+' aria-label="Descendre">'+ICDOWN+'</button>'+
    '<button class="iconbtn" data-sdel="'+i+'" title="Retirer" aria-label="Retirer ce tri">'+ICX+'</button>'+
  '</div>';
}

function sortPanelHtml(){
  var list=sortsFor(view);
  var rows=list.length
    ? list.map(function(r,i){return sortRowHtml(r,i,list);}).join("")
    : '<div class="empty-sort">Aucun tri. Les fiches remontent par priorité (ouvertures du livret, puis score).</div>';

  var canAdd=(list.length<MAX_SORTS && freeField(list));
  return '<div class="pop" id="sortPop">'+
    '<div class="poph"><span class="t">Trier</span>'+
      (list.length?'<button id="sortReset">Réinitialiser</button>':'')+
    '</div>'+
    rows+
    (canAdd?'<button class="addsort" id="sortAdd">'+ICPLUS+'Ajouter un tri</button>':'')+
    (list.length>1?'<div class="hint">Le tri 1 s\'applique en premier. Les suivants départagent les ex aequo.</div>':'')+
  '</div>';
}

function renderFilters(){
  var list=sortsFor(view);

  var depOpts='<option value="">Tous les départements</option>'+deps.map(function(d){
    return '<option value="'+esc(d.code)+'"'+(dep===d.code?' selected':'')+'>'+esc(d.code)+' ('+d.n+')</option>';
  }).join("");

  var actif=(list.length>0||dep!=="");
  document.getElementById("filters").innerHTML=
    '<button class="trigbtn'+(list.length?" active":"")+'" id="sortBtn" aria-expanded="'+(sortOpen?"true":"false")+'">'+
      ICSORT+'<span>'+esc(sortSummary(list))+'</span>'+
      (list.length>1?'<span class="n">'+list.length+'</span>':'')+
    '</button>'+
    '<span class="ctrl'+(dep?" active":"")+'">'+
      '<select id="selDep" aria-label="Département">'+depOpts+'</select>'+CHEV+'</span>'+
    (actif?'<button class="clearf" id="clearFilters">Réinitialiser</button>':'')+
    (sortOpen?sortPanelHtml():'');
}

/* Redessine uniquement la barre puis recharge : garde le panneau ouvert
   pendant qu'on empile les règles, comme dans Airtable. */
function applySorts(list){
  saveSorts(view,list);
  page=1;

  load();
}

      '<button id="next"'+(page>=pages?" disabled":"")+'>Suivant</button></span>'

/* ============================================================
   RENDU — CALENDRIER
   ============================================================ */
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var DOWS=["lun","mar","mer","jeu","ven","sam","dim"];
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function gridStart(d){          /* lundi de la semaine contenant le 1er du mois */
  var f=new Date(d.getFullYear(),d.getMonth(),1);
  var off=(f.getDay()+6)%7;     /* 0 = lundi */
  return new Date(f.getFullYear(),f.getMonth(),1-off);
}
function loadCalendar(){
  var start=gridStart(calCursor);
  var end=new Date(start); end.setDate(end.getDate()+41);
  document.getElementById("calBody").innerHTML='<div class="cal-empty">Chargement…</div>';
  return api({action:"calendar",from:ymd(start),to:ymd(end)}).then(function(d){
    calRows=Array.isArray(d)?d:[];
    renderCalendar();
  }).catch(function(e){
    if(e&&e.auth){showLogin("Mot de passe incorrect.");return;}
    document.getElementById("calBody").innerHTML='<div class="cal-empty">Erreur : '+esc(String(e))+'</div>';
  });
}
function renderCalendar(){
  document.getElementById("calTitle").textContent=MOIS[calCursor.getMonth()]+" "+calCursor.getFullYear();

  var byDay={};
  calRows.forEach(function(r,i){ (byDay[r.jour]=byDay[r.jour]||[]).push(i); });

  var start=gridStart(calCursor), today=ymd(new Date()), cells="";
  for(var i=0;i<42;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var key=ymd(d), out=(d.getMonth()!==calCursor.getMonth()), isToday=(key===today);
    var idx=byDay[key]||[];
    var evs=idx.slice(0,3).map(function(k){
      var r=calRows[k];
      var cls=(r.kind==="rdv"?("rdv "+(r.etat||"")):(r.etat||r.callback_state||""));
      return '<button class="cal-ev '+esc(cls)+'" data-cal="'+k+'">'+
        '<span class="h">'+esc(r.heure||"")+'</span><span class="n">'+esc(r.hotel_name)+'</span></button>';
    }).join("");
    if(idx.length>3) evs+='<div class="cal-more">+'+(idx.length-3)+' autre'+(idx.length-3>1?'s':'')+'</div>';
    cells+='<div class="cal-cell'+(out?" out":"")+(isToday?" today":"")+'">'+
      '<div class="cal-num"><span>'+d.getDate()+'</span>'+(idx.length?('<span class="cal-n">'+idx.length+'</span>'):'')+'</div>'+
      evs+'</div>';
  }
  document.getElementById("calBody").innerHTML=
    '<div class="cal"><div class="cal-dows">'+DOWS.map(function(x){return '<div>'+x+'</div>';}).join("")+'</div>'+
    '<div class="cal-grid">'+cells+'</div></div>'+
    (calRows.length?'':'<div class="cal-empty">Aucun rappel programmé sur cette période.</div>');
}
function setMode(m){
  mode=m;
  document.getElementById("viewCal").style.display=(m==="calendrier")?"":"none";
  document.getElementById("viewList").style.display=(m==="calendrier")?"none":"";
  document.getElementById("viewTitle").childNodes[0].nodeValue=(m==="calendrier")?"Calendrier des rappels":VIEWS[view].title;
  document.getElementById("viewCount").textContent="";
  renderNav();
  if(m==="calendrier") loadCalendar(); else load();
}

function openRecord(i){cursor=i;document.getElementById("overlay").classList.add("open");document.body.style.overflow="hidden";renderRecord();}
function closeRecord(){cursor=-1;document.getElementById("overlay").classList.remove("open");document.body.style.overflow="";}
function nextRecord(){
  if(cursor<rows.length-1){cursor++;renderRecord();}
  else if(page*PER<total){page++;load().then(function(){cursor=0;renderRecord();});}
}
function prevRecord(){
  if(cursor>0){cursor--;renderRecord();}
  else if(page>1){page--;load().then(function(){cursor=rows.length-1;renderRecord();});}
}

function field(k,v,copyVal,isLink){
  if(!v) return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v"><span class="t muted">—</span></div></div>';

  var cp=copyVal?('<button class="copy" data-copy="'+esc(v)+'" title="Copier">'+I.copy+'</button>'):"";
  return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v">'+val+cp+'</div></div>';
}

    '</div>';
  var coords='<div class="section"><div class="sec-head"><h3>Coordonnées</h3></div><div class="fields">'+

    emailField+
    field("Site web",r.website_link,false,true)+
    field("Ville",(r.city||"")+(r.departement_code?(" ("+r.departement_code+")"):""),false)+
  '</div></div>';

  var etab='<div class="section"><div class="sec-head"><h3>Établissement</h3></div><div class="fields">'+
    field("Type",(r.type||"hôtel")+(s?(" · "+s+" étoiles"):""),false)+
    field("Note Google",r.overall_rating?(Number(r.overall_rating).toFixed(1)+" / 5 · "+(r.reviews_count||0)+" avis"):"",false)+
    field("Tarif indicatif",r.rate_per_night?(r.rate_per_night+" € / nuit"):"",false)+

/* ============================================================
   FIL DES EMAILS (Smartlead)
   ============================================================ */
var mailCache={};

/* Le corps arrive en HTML depuis Smartlead : on le ramène en texte
   avant de l'afficher, jamais d'injection dans la page. */
function htmlToText(h){
  var s=String(h==null?"":h);
  s=s.replace(/<br\s*\/?>/gi,"\n")
     .replace(/<\/(div|p|tr|li|h[1-6])>/gi,"\n")
     .replace(/<li[^>]*>/gi,"• ")
     .replace(/<[^>]*>/g," ");
  s=s.replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<")
     .replace(/&gt;/gi,">").replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'");
  return s.replace(/[ \t]+/g," ").replace(/[ \t]*\n[ \t]*/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function ago(d){
  d=parseInt(d,10);
  if(isNaN(d)) return "";
  if(d===0) return "aujourd'hui";
  if(d===1) return "hier";
  if(d<7)  return "il y a "+d+" jours";
  if(d<14) return "il y a 1 semaine";
  if(d<31) return "il y a "+Math.round(d/7)+" semaines";
  return "il y a "+Math.round(d/30)+" mois";
}
function seqLabel(m){
  var n=parseInt(m.seq,10);
  if(m.direction==="reply") return "Réponse";
  if(isNaN(n)||n<=1) return "Premier mail";
  return "Relance "+(n-1);
}

function renderMails(d){
  var host=document.getElementById("mailThread");
  if(!host) return;
  var msgs=(d&&d.messages)||[], lead=(d&&d.lead)||null;

  if(!msgs.length){
    host.innerHTML='<p class="desc" style="margin:0">'+
      (lead&&lead.found===false
        ? 'Cette adresse n\'est dans aucune campagne Smartlead. Aucun email ne lui a été envoyé.'
        : 'Aucun email envoyé à ce prospect pour le moment.')+'</p>';
    return;
  }

  var sent=[],last=null,reply=null;
  for(var i=0;i<msgs.length;i++){
    if(msgs[i].direction==="reply"){reply=msgs[i];} else {sent.push(msgs[i]);last=msgs[i];}
  }

  /* La ligne que tu lis avant de décrocher. */
  var sum='';
  if(reply){
    sum='<div class="mailsum eng"><span class="big">Ce prospect a répondu</span>'+
        '<span class="sub">'+esc(reply.sent_label||"")+'</span></div>';
  } else if(last){
    sum='<div class="mailsum"><span class="big">'+esc(seqLabel(last))+' envoyé '+esc(ago(last.days_ago))+'</span>'+
        '<span class="sub">'+esc(last.sent_label||"")+' · '+sent.length+' email'+(sent.length>1?"s":"")+' au total</span></div>';
  }

  host.innerHTML=sum+msgs.map(function(m,i){
    var txt=htmlToText(m.body);
    var long=(txt.length>230||txt.indexOf("\n\n")>-1);
    return '<div class="mailitem'+(m.direction==="reply"?" reply":"")+'" data-mi="'+i+'">'+
      '<div class="mh"><span class="tag">'+esc(seqLabel(m))+'</span>'+
        '<span class="when">'+esc(m.sent_label||"")+(m.days_ago!=null?(" · "+esc(ago(m.days_ago))):"")+'</span></div>'+
      (m.subject?'<div class="subj">'+esc(m.subject)+'</div>':'')+
      '<div class="bodytxt'+(long?" long":"")+'">'+esc(txt)+'</div>'+
      (long?'<button class="more" data-mimore="'+i+'">Voir le message entier</button>':'')+
    '</div>';
  }).join("");
}

function loadMails(id,force){
  if(!force&&mailCache[id]){renderMails(mailCache[id]);return;}
  var host=document.getElementById("mailThread");
  if(host) host.innerHTML='<p class="desc" style="margin:0">'+(force?"Synchronisation avec Smartlead…":"Chargement de l'historique…")+'</p>';
  /* sync=true seulement au premier chargement ou sur demande : on évite
     de taper l'API Smartlead à chaque aller-retour entre les fiches. */
  api({action:"emails",id:id,sync:(force||!mailCache[id])}).then(function(d){
    mailCache[id]=d;
    var r=rows[cursor];
    if(r&&r.id===id) renderMails(d);
    if(force) toast("Historique à jour");
  }).catch(function(e){
    if(e&&e.auth){showLogin("Mot de passe incorrect.");return;}
    var h=document.getElementById("mailThread");
    if(h) h.innerHTML='<p class="desc" style="margin:0">Historique indisponible.</p>';
  });
}

/* ============================================================
   ACTIONS
   ============================================================ */
var RELANCE=function(nom){
  return "Bonjour,\n\nSuite à notre échange, voici le livret d'accueil digital que j'avais préparé pour "+nom+" : https://guide.solvia.pro\n\n"+
    "C'est une maquette personnalisée avec les infos de votre établissement. Vos clients y accèdent avec un simple lien avant d'arriver, et peuvent y réserver en un clic quelques petites attentions (petit-déjeuner, champagne, late check-out…).\n\n"+
    "Tout est modifiable au pixel près. Si ça vous parle, je serais ravi d'en discuter 15 minutes et de le mettre en place avec vous. Quand seriez-vous disponible ?\n\nBelle journée,\nQuentin";
};

function setStatus(id,s){
  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  if(!r)return;
  var old=r.crm_status||"nouveau", nv=(old===s)?"nouveau":s;
  if(counts[old]!=null)counts[old]=Math.max(0,counts[old]-1);
  if(counts[nv]!=null)counts[nv]=(counts[nv]||0)+1;
  r.crm_status=nv;
  renderNav();renderTable();if(cursor>=0)renderRecord();
  api({action:"save",id:id,status:(nv==="nouveau"?null:nv),notes:r.crm_notes||""})
    .catch(function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur de sauvegarde");});
}

var noteTimer={};
function saveNotes(id,val){
  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  if(r)r.crm_notes=val;
  clearTimeout(noteTimer[id]);
  noteTimer[id]=setTimeout(function(){
    api({action:"save",id:id,status:(r&&r.crm_status&&r.crm_status!=="nouveau")?r.crm_status:null,notes:val})
      .then(function(){
        var el=document.querySelector('[data-saved="'+CSS.escape(id)+'"]');
        if(el){el.style.opacity="1";clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity="0";},1200);}
      },function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur de sauvegarde");});
  },600);
}

function setCallback(id,localValue){
  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  var iso=null;
  if(localValue){ var d=new Date(localValue); if(!isNaN(d)) iso=d.toISOString(); }
  api({action:"set_callback",id:id,ts:iso}).then(function(){
    toast(iso?"Rappel programmé":"Rappel supprimé");
    (mode==="calendrier"?loadCalendar():load()).then(function(){ if(cursor>=0) renderRecord(); });
  },function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur");});
}

function setMeeting(id,localValue,dur){
  var iso=null;
  if(localValue){ var d=new Date(localValue); if(!isNaN(d)) iso=d.toISOString(); }
  api({action:"set_meeting",id:id,ts:iso,dur:dur||45}).then(function(){
    toast(iso?"Rendez-vous enregistré":"Rendez-vous supprimé");
    (mode==="calendrier"?loadCalendar():load()).then(function(){ if(cursor>=0) renderRecord(); });
  },function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur");});
}

var mailTimer={};
function setEmail(id,val){
  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  clearTimeout(mailTimer[id]);
  mailTimer[id]=setTimeout(function(){
    var v=(val||"").trim();
    // on n'enregistre une correction que si elle diffère de l'adresse d'origine
    var payload=(r&&v===(r.email_primary||""))?null:v;
    api({action:"set_email",id:id,email:payload}).then(function(){
      if(r)r.crm_email=payload; toast("Email enregistré");
    },function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur");});
  },700);
}

function resetOpen(id){
  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  if(!r)return;
  if(r.opens>0&&counts.ouvert!=null)counts.ouvert=Math.max(0,counts.ouvert-1);
  r.opens=0;r.last_open="";
  renderNav();renderTable();if(cursor>=0)renderRecord();
  toast("Ouverture annulée");
  api({action:"reset_open",id:id}).catch(function(e){if(e&&e.auth)showLogin("Session expirée.");else toast("Erreur");});
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.addEventListener("click",function(e){
  var t=e.target;

  /* ---- panneau de tri ---- */
  if(t.closest("#sortBtn")){ sortOpen=!sortOpen; renderFilters(); return; }
  if(sortOpen && !t.closest("#sortPop")){ sortOpen=false; renderFilters(); }

  if(t.closest("#sortReset")){ resetSorts(view); page=1; renderFilters(); load(); return; }

  if(t.closest("#sortAdd")){
    var la=sortsFor(view).slice(), nf=freeField(la);
    if(nf){ la.push({f:nf,d:(SORT_TYPE[nf]==="text"||SORT_TYPE[nf]==="statut")?"asc":"desc"}); applySorts(la); }
    return;
  }
  var sup=t.closest("[data-sup]");
  if(sup){
    var iu=parseInt(sup.getAttribute("data-sup"),10), lu=sortsFor(view).slice();
    if(iu>0){ var tmp=lu[iu-1]; lu[iu-1]=lu[iu]; lu[iu]=tmp; applySorts(lu); }
    return;
  }
  var sdn=t.closest("[data-sdown]");
  if(sdn){
    var id2=parseInt(sdn.getAttribute("data-sdown"),10), ld=sortsFor(view).slice();
    if(id2<ld.length-1){ var tm2=ld[id2+1]; ld[id2+1]=ld[id2]; ld[id2]=tm2; applySorts(ld); }
    return;
  }
  var sdl=t.closest("[data-sdel]");
  if(sdl){
    var ix=parseInt(sdl.getAttribute("data-sdel"),10), lx=sortsFor(view).slice();
    lx.splice(ix,1); applySorts(lx); return;
  }

  if(t.closest("#logout")){localStorage.removeItem(LSK);KEY="";showLogin("");return;}

  var md=t.closest("[data-mode]");
  if(md){closeRecord();setMode(md.getAttribute("data-mode"));return;}

  var nav=t.closest("[data-view]");
  if(nav){view=nav.getAttribute("data-view");page=1;dep="";closeRecord();
    if(mode!=="liste"){setMode("liste");}else{load();} return;}

  if(t.closest("#calPrev")){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);loadCalendar();return;}
  if(t.closest("#calNext")){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);loadCalendar();return;}
  if(t.closest("#calToday")){calCursor=new Date();loadCalendar();return;}

  var ce=t.closest("[data-cal]");
  if(ce){                       /* ouvre la fiche ; les flèches parcourent alors les rappels */
    rows=calRows; total=calRows.length; page=1;
    openRecord(parseInt(ce.getAttribute("data-cal"),10)); return;
  }

  if(t.closest("#clearFilters")){
    resetSorts(view);dep="";page=1;renderFilters();load();return;
  }

  var stBtn=t.closest("[data-status]");
  if(stBtn){setStatus(stBtn.getAttribute("data-status"),stBtn.getAttribute("data-s"));return;}

  var cbc=t.closest("[data-cbclear]");
  if(cbc){ setCallback(cbc.getAttribute("data-cbclear"),""); return; }

  var mtc=t.closest("[data-mtclear]");
  if(mtc){ setMeeting(mtc.getAttribute("data-mtclear"),""); return; }

  var msy=t.closest("[data-mailsync]");
  if(msy){loadMails(msy.getAttribute("data-mailsync"),true);return;}

  var mmo=t.closest("[data-mimore]");
  if(mmo){
    var it=mmo.closest(".mailitem");
    if(it){ it.classList.add("open"); mmo.remove(); }
    return;
  }

  var rs=t.closest("[data-reset]");
  if(rs){resetOpen(rs.getAttribute("data-reset"));return;}

  var rel=t.closest("[data-relance]");
  if(rel){
    var id=rel.getAttribute("data-relance"),rec=null;
    for(var i=0;i<rows.length;i++){if(rows[i].id===id){rec=rows[i];break;}}
    copyText(RELANCE(rec?rec.hotel_name:"votre établissement"),"Relance copiée");return;
  }

  var cp=t.closest("[data-copy]");
  if(cp){copyText(cp.getAttribute("data-copy"),"Copié");return;}

  if(t.closest("#prev")){if(page>1){page--;closeRecord();load();}return;}
  if(t.closest("#next")){page++;closeRecord();load();return;}
  if(t.closest("#nextRec")){nextRecord();return;}
  if(t.closest("#prevRec")){prevRecord();return;}
  if(t.closest("#closeRec")){closeRecord();return;}
  if(t.id==="overlay"){closeRecord();return;}       /* clic sur les bords floutés */

  var row=t.closest("[data-idx]");
  if(row){openRecord(parseInt(row.getAttribute("data-idx"),10));return;}
});

document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toUpperCase();
  var typing=(tag==="INPUT"||tag==="TEXTAREA");
  if(cursor>=0){
    if(e.key==="Escape"&&!typing){closeRecord();return;}
    if(typing)return;
    if(e.key==="ArrowRight"){e.preventDefault();nextRecord();}
    else if(e.key==="ArrowLeft"){e.preventDefault();prevRecord();}
    return;
  }
  if(!typing&&(e.key==="/"||e.key==="k"&&(e.metaKey||e.ctrlKey))){e.preventDefault();document.getElementById("q").focus();}
  var r=e.target.closest&&e.target.closest("[data-idx]");
  if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openRecord(parseInt(r.getAttribute("data-idx"),10));}
});

document.addEventListener("change",function(e){
  var sf=e.target.closest("[data-sfield]");
  if(sf){
    var i1=parseInt(sf.getAttribute("data-sfield"),10), l1=sortsFor(view).slice();
    var nf1=e.target.value;
    /* le champ change : on repart sur le sens naturel de son type */
    l1[i1]={f:nf1,d:(SORT_TYPE[nf1]==="text"||SORT_TYPE[nf1]==="statut")?"asc":"desc"};
    applySorts(l1);return;
  }
  var sd=e.target.closest("[data-sdir]");
  if(sd){
    var i2=parseInt(sd.getAttribute("data-sdir"),10), l2=sortsFor(view).slice();
    if(l2[i2]){ l2[i2]={f:l2[i2].f,d:(e.target.value==="asc"?"asc":"desc")}; applySorts(l2); }
    return;
  }
  if(e.target.id==="selDep"){ dep=e.target.value;page=1;load();return; }
  var cb=e.target.closest("[data-cb]");
  if(cb){ setCallback(cb.getAttribute("data-cb"),cb.value); return; }

  var mt=e.target.closest("[data-mt]");
  if(mt){ setMeeting(mt.getAttribute("data-mt"),mt.value,45); return; }
});

var qTimer;
document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    query=e.target.value;page=1;
    clearTimeout(qTimer);qTimer=setTimeout(load,280);return;
  }
  var ta=e.target.closest("[data-notes]");
  if(ta){saveNotes(ta.getAttribute("data-notes"),ta.value);return;}
  var em=e.target.closest("[data-email]");
  if(em)setEmail(em.getAttribute("data-email"),em.value);
});

/* ============================================================
   LOGIN
   ============================================================ */
function showLogin(msg){
  closeRecord();
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("loginErr").textContent=msg||"";
  var p=document.getElementById("pass");p.value="";p.focus();
}
function enterApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="grid";
}
function tryLogin(){
  var v=document.getElementById("pass").value.trim();
  if(!v)return;
  KEY=v;localStorage.setItem(LSK,v);
  document.getElementById("loginErr").textContent="Vérification…";
  api({action:"ping"}).then(function(){enterApp();load();})
    .catch(function(e){
      if(e&&e.auth){localStorage.removeItem(LSK);KEY="";showLogin("Mot de passe incorrect.");}
      else showLogin("Erreur réseau : "+String(e));
    });
}
document.getElementById("loginBtn").addEventListener("click",tryLogin);
document.getElementById("pass").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin();});

if(KEY){
  enterApp();
  api({action:"ping"}).then(function(){load();})
    .catch(function(e){ if(e&&e.auth){KEY="";localStorage.removeItem(LSK);showLogin("");} else load(); });
}else showLogin("");
</script>
