<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRM SolvIA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f0f10%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Inter%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* surfaces */
  --bg:#ffffff;
  --bg-sub:#fafafa;
  --surface:#ffffff;
  --surface-2:#f6f7f8;
  --hover:#f6f7f8;
  --selected:#eef0f4;

  /* traits */
  --line:#ebebee;
  --line-strong:#dedee3;

  /* encre */
  --ink:#0f0f10;
  --ink-2:#5c5f66;
  --ink-3:#8f939c;

  /* action */
  --btn:#0f0f10;
  --btn-ink:#ffffff;
  --focus:#8a8f99;

  /* sémantique : engagement */
  --eng:#3549a5;      --eng-bg:#eef1fb;
  /* sémantique : statuts */
  --rappel:#8a6100;   --rappel-bg:#fdf4e0;
  --rdv:#166b40;      --rdv-bg:#e7f4ec;
  --non:#a83228;      --non-bg:#fceeec;
  --inj:#55565c;      --inj-bg:#f1f1f3;
  --att:#6d4bb0;      --att-bg:#f1ecfa;
  --neutral:#6b6f78;  --neutral-bg:#f2f3f5;

  --link:#2b5bd7;

  /* rayons — parti pris carré */
  --r-sm:3px; --r:4px; --r-md:5px; --r-lg:6px;

  /* typo */
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* ombres — nettes, quasi absentes */
  --sh-1:none;
  --sh-2:0 24px 60px -24px rgba(15,15,16,.34);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.5;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--link);text-decoration:none}
input,textarea{font:inherit}
::selection{background:#dfe3ee}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.label{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
/* Chiffres, dates et codes en mono */
.tnum,.rating .v,.rating .n,.dep,.opened .dt,.navitem .ct,.rec-pos,.pager,.cal-num,.cal-ev .h,.cal-n{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}

/* ============================================================
   LOGIN
   ============================================================ */
.login{position:fixed;inset:0;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
.login .card{width:100%;max-width:352px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:32px}
.login .mark{width:36px;height:36px;border-radius:var(--r-md);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:20px}
.login h1{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.login p{margin:0 0 20px;color:var(--ink-3);font-size:13px}
.login input{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);outline:none;transition:border-color .12s}
.login input:focus{border-color:var(--focus)}
.login .err{color:var(--non);font-size:12.5px;min-height:18px;padding:6px 0 4px}
.login button{width:100%;padding:11px;border-radius:var(--r);background:var(--btn);color:var(--btn-ink);font-weight:600}
.login button:hover{opacity:.88}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:242px minmax(0,1fr);height:100vh}

/* --- Sidebar --- */
.side{
  background:var(--bg-sub);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px 12px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.brand .mark{width:24px;height:24px;border-radius:var(--r-sm);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.brand .txt{line-height:1.25}
.brand .n{font-weight:600;font-size:14px}
.brand .s{color:var(--ink-3);font-size:11.5px}

.navgroup{margin-bottom:22px}
.navgroup > .label{padding:0 10px 7px}
.nav{display:flex;flex-direction:column;gap:1px}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--r);color:var(--ink-2);font-weight:450;font-size:13.5px;
  transition:background .1s,color .1s;
}
.navitem:hover{background:#f0f0f2;color:var(--ink)}
.navitem[aria-current="true"]{background:var(--selected);color:var(--ink);font-weight:600}
/* modes (Liste / Calendrier) : icône */
.navitem .ic{width:15px;height:15px;flex:none;color:var(--ink-3)}
.navitem .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navitem[aria-current="true"] .ic{color:var(--ink)}
/* filtres : pastille de couleur */
.navitem .dot{width:6px;height:6px;border-radius:2px;flex:none;background:var(--line-strong);margin:0 4px}
.navitem[aria-current="true"] .dot{background:var(--ink-3)}
.navitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .ct{font-size:11.5px;color:var(--ink-3);font-weight:500}
.navitem[aria-current="true"] .ct{color:var(--ink-2)}
.d-eng{background:var(--eng)!important}
.d-rappel{background:var(--rappel)!important}
.d-rdv{background:var(--rdv)!important}
.d-non{background:var(--non)!important}
.d-inj{background:var(--inj)!important}
.d-att{background:var(--att)!important}

.side-foot{margin-top:auto;padding:14px 9px 2px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;line-height:1.7}
.side-foot button{color:var(--ink-3);text-decoration:underline;font-size:12px;padding:0}
.side-foot button:hover{color:var(--ink-2)}

/* --- Main --- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  flex:none;display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;border-bottom:1px solid var(--line);
}
.topbar h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.topbar .cnt{color:var(--ink-3);font-weight:450;font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.search{
  margin-left:auto;flex:1;max-width:340px;display:flex;align-items:center;gap:8px;
  height:34px;padding:0 12px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);
  transition:background .12s,border-color .12s;
}
.search:focus-within{background:var(--surface);border-color:var(--focus)}
.search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.9;flex:none}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}

.scroll{flex:1;overflow-y:auto}
.content{padding:8px 24px 64px}

/* --- Barre de filtres --- */
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 12px 12px}
.ctrl{position:relative;display:inline-flex;align-items:center}
.ctrl select{
  appearance:none;-webkit-appearance:none;
  padding:6px 28px 6px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;
  cursor:pointer;outline:none;transition:background .1s,border-color .1s;
}
.ctrl select:hover{background:var(--hover)}
.ctrl select:focus{border-color:var(--focus)}
.ctrl.active select{background:var(--selected);border-color:var(--line-strong);font-weight:600}
.ctrl .chev{
  position:absolute;right:9px;pointer-events:none;color:var(--ink-3);
  width:12px;height:12px;
}
.ctrl .chev svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctrl .k{font-size:11.5px;color:var(--ink-3);margin-right:6px;white-space:nowrap}
.clearf{
  padding:6px 10px;border-radius:var(--r);border:1px solid transparent;
  color:var(--ink-3);font-size:12.5px;font-weight:500;
}
.clearf:hover{background:var(--hover);color:var(--ink-2)}

/* --- Tri multi-niveaux (panneau) --- */
.filters{position:relative}
.trigbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;
  transition:background .1s,border-color .1s;
}
.trigbtn:hover{background:var(--hover)}
.trigbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.trigbtn.active{background:var(--selected);font-weight:600}
.trigbtn .n{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  min-width:15px;height:15px;padding:0 3px;border-radius:var(--r-sm);
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
}

.pop{
  position:absolute;top:calc(100% - 4px);left:12px;z-index:60;
  width:534px;max-width:calc(100vw - 32px);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -18px rgba(15,15,16,.30);
  padding:12px;
}
.pop .poph{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 10px;margin-bottom:10px;border-bottom:1px solid var(--line);
}
.pop .poph .t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pop .poph button{color:var(--ink-3);font-size:12px;padding:2px 6px;border-radius:var(--r-sm)}
.pop .poph button:hover{background:var(--hover);color:var(--ink-2)}

.sortrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sortrow .rk{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:16px;flex:none;text-align:center}
.sortrow select{
  appearance:none;-webkit-appearance:none;
  height:30px;padding:0 24px 0 9px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;outline:none;
}
.sortrow select:hover{background:var(--hover)}
.sortrow select:focus{border-color:var(--focus)}
.sortrow .f{flex:1;min-width:0}
.sortrow .d{flex:none;width:176px}
.sortrow .wrap{position:relative;display:flex;align-items:center}
.sortrow .wrap select{width:100%}
.sortrow .wrap .chev{position:absolute;right:8px;pointer-events:none;color:var(--ink-3);width:11px;height:11px}
.sortrow .wrap .chev svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{
  width:28px;height:28px;flex:none;border-radius:var(--r);color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.22;pointer-events:none}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pop .addsort{
  display:inline-flex;align-items:center;gap:7px;margin-top:4px;
  padding:6px 9px;border-radius:var(--r);color:var(--ink-2);font-size:12.5px;font-weight:500;
}
.pop .addsort:hover{background:var(--hover);color:var(--ink)}
.pop .addsort svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pop .hint{padding:8px 2px 2px;margin-top:6px;border-top:1px solid var(--line);color:var(--ink-3);font-size:11.5px;line-height:1.5}
.pop .empty-sort{padding:2px 2px 8px;color:var(--ink-3);font-size:12.5px}

@media (max-width:640px){
  .pop{width:auto;left:12px;right:12px}
  .sortrow{flex-wrap:wrap}
  .sortrow .d{width:100%}
}

/* ============================================================
   TABLE
   ============================================================ */
.thead,.trow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 152px 146px 132px 132px;
  align-items:center;gap:20px;padding:0 12px;
}
.thead{height:34px;border-bottom:1px solid var(--line-strong);position:sticky;top:0;background:var(--bg);z-index:2}
.thead > div{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.trow{
  min-height:62px;border-bottom:1px solid var(--line);
  border-radius:var(--r);transition:background .1s;
}
.trow:hover{background:var(--hover)}

.c-name{display:flex;align-items:center;gap:12px;min-width:0}
.mono{
  position:relative;overflow:hidden;
  width:32px;height:32px;flex:none;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:650;letter-spacing:.01em;
}
.mono.eng{background:var(--eng-bg);color:var(--eng)}
/* Favicon de l'établissement : recouvre les initiales quand il charge,
   disparaît (onerror) et laisse les initiales sinon. */
.mono .fav{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;padding:5px;background:#fff;
  box-shadow:inset 0 0 0 1px var(--line);border-radius:inherit;
}
.mono.eng .fav{box-shadow:inset 0 0 0 1px var(--eng-bg)}
.c-name .txt{min-width:0}
.c-name .t1{font-weight:600;font-size:14px;letter-spacing:-.011em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name .t2{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--ink-3);font-size:12.5px;overflow:hidden;white-space:nowrap}
.c-name .t2 .sep{opacity:.5}
.cbchip{
  flex:none;display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:5px;
  font-size:11px;font-weight:600;background:var(--rappel-bg);color:var(--rappel);
}
.cbchip.retard{background:var(--non-bg);color:var(--non)}
.cbchip.futur{background:var(--surface-2);color:var(--ink-2)}
.inp{
  width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:13.5px;outline:none;transition:border-color .12s;
}
.inp:focus{border-color:var(--focus)}
.hintline{margin-top:6px;font-size:12px;color:var(--ink-3)}
.corrige{display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;background:var(--rdv-bg);color:var(--rdv);font-size:10.5px;font-weight:600;margin-left:6px}
.dep{
  flex:none;padding:1px 5px;border-radius:var(--r-sm);background:var(--surface-2);
  color:var(--ink-2);font-size:10.5px;font-weight:500;border:1px solid var(--line);
}

.rating{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.rating .v{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.rating .n{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

.opened{display:flex;align-items:center;gap:7px;white-space:nowrap}
.opened .pt{width:6px;height:6px;border-radius:50%;background:var(--eng);flex:none}
.opened .dt{color:var(--eng);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}

/* Dernier mail envoyé : la fraîcheur se lit à la couleur, comme l'ouverture. */
/* Échéance */
.due{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;min-width:0}
.due .ty{
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 5px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--neutral);
}
.due .dt{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.due.k-rappel .ty{background:var(--rappel-bg);color:var(--rappel)}
.due.k-rappel .dt{color:var(--rappel)}
.due.k-rdv .ty{background:var(--rdv-bg);color:var(--rdv)}
.due.k-rdv .dt{color:var(--rdv)}
.due.k-attente .ty{background:var(--att-bg);color:var(--att)}
.due.k-attente .dt{color:var(--att)}
.due.late .ty{background:var(--non);color:#fff}
.due.late .dt{color:var(--non)}

.sent{display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.sent .pt{width:6px;height:6px;border-radius:50%;flex:none;background:var(--line-strong)}
.sent .dt{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sent .nb{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* aujourd'hui / hier : frais, on le voit tout de suite */
.sent.fresh .pt{background:var(--rdv)}
.sent.fresh .dt{color:var(--rdv)}
/* cette semaine */
.sent.warm .pt{background:var(--rappel)}
.sent.warm .dt{color:var(--rappel)}
/* rebond : l'adresse ne reçoit pas */
.sent.bad .pt{background:var(--non)}
.sent.bad .dt{color:var(--non)}
/* a répondu */
.sent.rep .pt{background:var(--eng)}
.sent.rep .dt{color:var(--eng)}

/* Refus explicite : le seul marqueur volontairement voyant du tableau.
   Il doit se voir avant même de lire le nom de l'établissement. */
.refus{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  color:var(--non);
}
.refus svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
.refus .dt{font-size:12.5px;font-weight:600}

/* Bandeau de refus en tête de fiche */
.alert{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 16px;margin-bottom:20px;border-radius:var(--r-md);
  background:var(--non-bg);border:1px solid var(--non);
}
.alert .ic{flex:none;width:20px;height:20px;color:var(--non);margin-top:1px}
.alert .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.1}
.alert .tx{min-width:0;flex:1}
.alert .ti{font-size:14.5px;font-weight:700;color:var(--non);letter-spacing:-.01em}
.alert .sb{margin-top:3px;font-size:12.5px;color:var(--non);opacity:.85;font-family:var(--mono)}
.alert .qt{
  margin-top:9px;padding:9px 11px;border-radius:var(--r);
  background:rgba(255,255,255,.65);color:var(--ink);font-size:13px;line-height:1.6;font-style:italic;
}
.alert .act{margin-top:11px}
.alert .act button{
  padding:7px 13px;border-radius:var(--r);border:1px solid var(--non);
  background:var(--non);color:#fff;font-size:12.5px;font-weight:600;
}
.alert .act button:hover{opacity:.88}
.alert .act .done{background:transparent;color:var(--non);font-weight:600;font-size:12.5px;padding:7px 0}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;white-space:nowrap;
  background:var(--neutral-bg);color:var(--neutral);
}
.pill .pd{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill[data-s="rappel"]{background:var(--rappel-bg);color:var(--rappel)}
.pill[data-s="rdv"]{background:var(--rdv-bg);color:var(--rdv)}
.pill[data-s="non"]{background:var(--non-bg);color:var(--non)}
.pill[data-s="injoignable"]{background:var(--inj-bg);color:var(--inj)}

.empty{padding:72px 0;text-align:center;color:var(--ink-3)}
.empty .big{font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:4px}

.pager{display:flex;align-items:center;justify-content:space-between;padding:18px 12px 0;color:var(--ink-3);font-size:12.5px}
.pager .grp{display:flex;gap:8px}
.pager button{padding:7px 13px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font-weight:500;font-size:13px}
.pager button:hover:not(:disabled){background:var(--hover)}
.pager button:disabled{opacity:.4;cursor:default}

/* ============================================================
   RECORD (plein écran)
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;gap:20px;padding:32px 20px;
  background:rgba(15,15,16,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.overlay.open{display:flex}

/* Grandes flèches latérales, hors du panneau */
.sidearrow{
  flex:none;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px -4px rgba(15,15,16,.45);transition:transform .12s,opacity .12s;
}
.sidearrow:hover:not(:disabled){transform:scale(1.07)}
.sidearrow:disabled{opacity:.28;cursor:default}
.sidearrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.record{
  width:100%;max-width:1180px;height:100%;max-height:100%;
  background:var(--surface);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--sh-2);
  animation:rise .16s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}

.rec-bar{
  flex:none;display:flex;align-items:center;gap:8px;height:54px;
  padding:0 20px;border-bottom:1px solid var(--line);
}
.iconbtn{
  width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .1s,color .1s;
}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rec-pos{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-left:4px}
.rec-bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-variant-numeric:tabular-nums}

.rec-scroll{flex:1;overflow-y:auto}
.rec-inner{max-width:1080px;margin:0 auto;padding:28px 28px 72px}
/* deux colonnes : à gauche ce qui sert pendant l'appel, à droite l'historique */
.reccols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 34px;align-items:start}
.reccols > div{min-width:0}
.reccols .section:first-child{margin-top:0}
@media(max-width:1000px){.reccols{grid-template-columns:minmax(0,1fr);gap:0}}

/* identité */
.hero{display:flex;align-items:flex-start;gap:16px}
.hero .mono{width:52px;height:52px;border-radius:var(--r-md);font-size:17px}
.hero .h-txt{min-width:0;flex:1}
.hero h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.hero .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;color:var(--ink-2);font-size:13px}
.hero .meta .sep{color:var(--ink-3);opacity:.6}
.hero .pill{margin-top:0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{
  display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:var(--r-sm);
  font-size:12px;font-weight:600;background:var(--eng-bg);color:var(--eng);
}
.badge .pt{width:6px;height:6px;border-radius:50%;background:currentColor}

/* actions */
/* barre d'actions */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-size:13px;font-weight:500;transition:background .1s;
}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.88;background:var(--btn)}
.btn.danger{color:var(--non);border-color:var(--non-bg);background:var(--non-bg)}
.btn.danger:hover{background:#f9e2de}

/* sections */
.section{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.sec-head h3{margin:0;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.saved{font-size:11.5px;color:var(--rdv);font-weight:500;opacity:0;transition:opacity .2s}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 22px}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
@media(max-width:620px){.fields{grid-template-columns:1fr}}
.field{min-width:0}
.field .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:4px}
.field .v{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.field .v .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{
  width:26px;height:26px;flex:none;border-radius:var(--r-sm);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);opacity:0;transition:opacity .12s,color .1s;
}
.field:hover .copy{opacity:1}
.copy:hover{color:var(--ink);background:var(--hover)}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.desc{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65}

/* suivi */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.segbtn{
  padding:8px 14px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;transition:.1s;
}
.segbtn:hover{background:var(--hover);color:var(--ink)}
.segbtn[aria-pressed="true"]{font-weight:600;border-color:transparent}
.segbtn[aria-pressed="true"][data-s="rappel"]{background:var(--rappel-bg);color:var(--rappel)}
.segbtn[aria-pressed="true"][data-s="rdv"]{background:var(--rdv-bg);color:var(--rdv)}
.segbtn[aria-pressed="true"][data-s="attente"]{background:var(--att-bg);color:var(--att)}
.segbtn[aria-pressed="true"][data-s="client"]{background:var(--rdv-bg);color:var(--rdv)}
.segbtn[aria-pressed="true"][data-s="non"]{background:var(--non-bg);color:var(--non)}
.segbtn[aria-pressed="true"][data-s="injoignable"]{background:var(--inj-bg);color:var(--inj)}

textarea.notes{
  width:100%;min-height:96px;resize:vertical;padding:12px 14px;
  border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);
  color:var(--ink);font-size:13.5px;line-height:1.65;outline:none;transition:border-color .12s;
}
textarea.notes:focus{border-color:var(--focus)}
textarea.notes::placeholder{color:var(--ink-3)}

.note-hint{margin-top:8px;font-size:12px;color:var(--ink-3)}
.echline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.statsel select{padding:3px 24px 3px 9px;font-size:12.5px;border-radius:var(--r)}
.statsel .chev{right:7px}

/* --- Fil des emails --- */
.linkbtn.sync{color:var(--ink-3);font-size:12px}
.linkbtn.sync:hover{color:var(--ink)}
.mailsum{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:11px 13px;margin-bottom:18px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line);
}
.mailsum .big{font-size:13.5px;font-weight:600;color:var(--ink)}
.mailsum .sub{font-size:12.5px;color:var(--ink-2)}
.mailsum.eng{background:var(--eng-bg);border-color:transparent}
.mailsum.eng .big{color:var(--eng)}
.mailsum.bad{background:var(--non-bg);border-color:transparent}
.mailsum.bad .big{color:var(--non)}

.mailitem{border-left:2px solid var(--line-strong);padding:0 0 18px 14px;margin-left:3px}
.mailitem:last-child{padding-bottom:0}
.mailitem.reply{border-left-color:var(--rdv)}
.mailitem.bounce{border-left-color:var(--non)}
.mailitem.auto{border-left-color:var(--line-strong)}
.mailitem .mh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.mailitem .tag{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--neutral);
}
.mailitem.reply .tag{background:var(--rdv-bg);color:var(--rdv)}
.mailitem.bounce .tag{background:var(--non-bg);color:var(--non)}
.mailitem .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.mailitem .subj{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.45}
.mailitem .bodytxt{
  color:var(--ink-2);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  position:relative;
}
.mailitem .bodytxt.long{max-height:76px;overflow:hidden}
.mailitem .bodytxt.long::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:30px;
  background:linear-gradient(to bottom,rgba(255,255,255,0),var(--bg));
}
.mailitem.open .bodytxt.long{max-height:none;overflow:visible}
.mailitem.open .bodytxt.long::after{display:none}
.mailitem .more{margin-top:7px;color:var(--link);font-size:12.5px;font-weight:500;padding:0}
.mailitem .more:hover{text-decoration:underline}

/* ============================================================
   PANNEAU D'APPEL
   ============================================================ */
.callwrap{
  /* au-dessus de la fiche (overlay z-index 200) : on appelle DEPUIS la fiche */
  position:fixed;inset:0;z-index:300;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(15,15,16,.34);backdrop-filter:blur(3px);
}
.callwrap.open{display:flex}
.callbox{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  box-shadow:0 30px 70px -24px rgba(15,15,16,.45);
}
.callbox .hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.callbox .hd .who{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.callbox .hd h3{margin:3px 0 0;font-size:16px;font-weight:650;letter-spacing:-.015em}
.callbox .bd{padding:18px 20px 20px}

/* le numéro, en grand, avec sa copie */
.numrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.numrow .num{
  flex:1;font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:.01em;
  color:var(--ink);user-select:all;
}
.numrow .cp{
  padding:8px 12px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
}
.numrow .cp:hover{background:var(--hover)}
.numrow .cp svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
.numrow .cp.done{background:var(--rdv-bg);border-color:transparent;color:var(--rdv)}
.callbox .askname{font-size:13px;color:var(--ink-2);margin-bottom:16px}
.callbox .askname b{color:var(--ink)}

/* argumentaire */
.pitch{margin-bottom:16px}
.callbox .pitch{border-top:1px solid var(--line);padding-top:14px}
.pitch .ask{font-size:14.5px;color:var(--ink-2);margin-bottom:11px}
.pitch .ask b{color:var(--ink);font-weight:650}
.pitch .lev{display:flex;flex-wrap:wrap;gap:6px}
.pitch .tag{
  padding:6px 11px;border-radius:var(--r);background:var(--eng-bg);color:var(--eng);
  font-size:13px;font-weight:600;cursor:help;
}
.pitch .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pitch .facts span{
  font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-3);
}

/* résultat de l'appel */
.outc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:14px}
.outc button{
  padding:11px 12px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;text-align:left;
}
.outc button:hover{background:var(--hover);color:var(--ink)}
.outc button[aria-pressed="true"]{font-weight:650;border-color:transparent}
.outc button[aria-pressed="true"][data-c="rappel"]{background:var(--rappel-bg);color:var(--rappel)}
.outc button[aria-pressed="true"][data-c="rdv"]{background:var(--rdv-bg);color:var(--rdv)}
.outc button[aria-pressed="true"][data-c="non"]{background:var(--non-bg);color:var(--non)}
.outc button[aria-pressed="true"][data-c="inj"]{background:var(--inj-bg);color:var(--inj)}
.outc button[aria-pressed="true"][data-c="attente"]{background:var(--att-bg);color:var(--att)}
.outc button[aria-pressed="true"][data-c="eng"]{background:var(--eng-bg);color:var(--eng)}
.outc button[aria-pressed="true"][data-c="neutral"]{background:var(--selected);color:var(--ink)}

.callbox .when{margin-bottom:14px}
.callbox .when .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin-bottom:5px}
.callbox .when .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.callbox .when .quick button{
  padding:5px 10px;border-radius:var(--r);border:1px solid var(--line-strong);
  background:var(--surface);font-size:12px;font-weight:500;color:var(--ink-2);
}
.callbox .when .quick button:hover{background:var(--hover);color:var(--ink)}
.callbox .ft{display:flex;align-items:center;gap:10px;justify-content:flex-end;
  padding-top:14px;border-top:1px solid var(--line)}
.callbox .ft .sp{margin-right:auto;font-size:12px;color:var(--ink-3)}

/* historique des appels */
.callitem{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.callitem:last-child{border-bottom:0}
.callitem .dot2{width:7px;height:7px;border-radius:2px;margin-top:6px;flex:none;background:var(--line-strong)}
.callitem .dot2.c-rappel{background:var(--rappel)} .callitem .dot2.c-rdv{background:var(--rdv)}
.callitem .dot2.c-non{background:var(--non)} .callitem .dot2.c-inj{background:var(--inj)}
.callitem .dot2.c-attente{background:var(--att)} .callitem .dot2.c-eng{background:var(--eng)}
.callitem .cx{min-width:0;flex:1}
.callitem .c1{font-size:13.5px;font-weight:600;color:var(--ink)}
.callitem .c2{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:1px}
.callitem .c3{margin-top:4px;font-size:13px;color:var(--ink-2);line-height:1.55;white-space:pre-wrap}

/* ligne de statut email en tete de fiche */
.mailline{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:9px 12px;margin-bottom:14px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);
}
.mailline b{color:var(--ink);font-weight:600}
.mailline .sep2{color:var(--line-strong)}
.mailline.eng{background:var(--eng-bg);border-color:transparent;color:var(--eng)}
.mailline.eng b{color:var(--eng)}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:var(--r-md);
  font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:400;box-shadow:var(--sh-2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ============================================================
   CALENDRIER
   ============================================================ */
.cal-bar{display:flex;align-items:center;gap:10px;padding:12px 12px 16px}
.cal-title{font-size:15px;font-weight:600;letter-spacing:-.015em;min-width:170px;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-today{margin-left:4px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--r);font-size:12.5px;font-weight:500;background:var(--surface)}
.cal-today:hover{background:var(--hover)}
.cal-legend{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-3)}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}

.cal{border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.cal-dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface-2);border-bottom:1px solid var(--line)}
.cal-dows div{padding:8px 10px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:var(--bg-sub)}
.cal-cell.today{background:#fbfaf5}
.cal-num{font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between}
.cal-cell.out .cal-num{color:var(--ink-3);font-weight:450}
.cal-cell.today .cal-num span:first-child{
  background:var(--btn);color:var(--btn-ink);width:21px;height:21px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;
}
.cal-n{font-size:10.5px;color:var(--ink-3);font-weight:600}
.cal-ev{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  padding:4px 7px;border-radius:6px;background:var(--rappel-bg);color:var(--rappel);
  font-size:11.5px;font-weight:600;overflow:hidden;
}
.cal-ev:hover{filter:brightness(.96)}
.cal-ev.retard{background:var(--non-bg);color:var(--non)}
.cal-ev.futur{background:var(--surface-2);color:var(--ink-2)}
.cal-ev.rdv{background:var(--rdv-bg);color:var(--rdv)}
.cal-ev.rdv.passe{background:var(--surface-2);color:var(--ink-3)}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
@media(max-width:620px){.plan{grid-template-columns:1fr}}
.plan .k{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-bottom:5px}
.dtin{
  width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;outline:none;
}
.dtin:focus{border-color:var(--focus)}
.plan .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.linkbtn{font-size:12.5px;color:var(--ink-3);text-decoration:underline}
.linkbtn:hover{color:var(--ink-2)}
.cal-ev .h{font-variant-numeric:tabular-nums;flex:none;opacity:.85}
.cal-ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.cal-more{font-size:11px;color:var(--ink-3);padding:1px 7px;text-align:left}
.cal-empty{padding:60px 0;text-align:center;color:var(--ink-3)}
@media(max-width:860px){
  .cal-cell{min-height:84px;padding:5px}
  .cal-ev .h{display:none}
  .cal-dows div{padding:6px}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:860px){
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .brand{padding:0 4px 12px}
  .navgroup{margin-bottom:10px}
  .navgroup > .label{padding:0 4px 6px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .navitem{width:auto;border:1px solid var(--line-strong);background:var(--surface);padding:6px 11px}
  .side-foot{display:none}
  .main{overflow:visible}

/* ============================================================

   ============================================================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
/* Mots trop génériques pour identifier un établissement : on les écarte
   pour que le monogramme porte le nom distinctif (Hôtel Le Grand Aigle -> GA). */
var STOP=("hotel hostellerie auberge logis relais residence appart apparthotel motel "+
  "chambre chambres maison maisons hote hotes domaine chateau manoir mas villa bastide "+
  "camping gite gites restaurant brasserie spa resort le la les l un une du de des d au aux "+
  "a et en sur sous the and by").split(" ");
function initials(n){
  var raw=String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^A-Za-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);
  if(!raw.length) return "?";
  var w=raw.filter(function(x){return STOP.indexOf(x.toLowerCase())<0;});
  if(!w.length) w=raw;
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function mailOf(r){return (r.crm_email&&r.crm_email.trim())||r.email_primary||"";}
/* Adresse d'invitation du RDV : celle donnée au téléphone si elle existe,
   sinon l'adresse de campagne. */
function inviteOf(r){return (r.meeting_email&&r.meeting_email.trim())||mailOf(r);}
function gcalUrl(r){
  var titre="RDV SolvIA · "+(r.hotel_name||"");
  var detail=[
    "Rendez-vous de présentation du livret d'accueil digital.",
    r.phone_primary?("Téléphone : "+r.phone_primary):"",
    (r.crm_email||r.email_primary)?("Email : "+(r.crm_email||r.email_primary)):"",
    r.guidebook_slug?("Guidebook : https://guide.solvia.pro/?slug="+r.guidebook_slug):"",
    "Fiche CRM : https://guide.solvia.pro/crm/",
    r.crm_notes?("\nNotes : "+r.crm_notes):""
  ].filter(Boolean).join("\n");
  var lieu=[r.hotel_name,r.city,r.departement_code?("("+r.departement_code+")"):""].filter(Boolean).join(" ");
  var invite=inviteOf(r);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(titre)+
    "&dates="+encodeURIComponent((r.meeting_utc||"")+"/"+(r.meeting_utc_end||""))+
    "&details="+encodeURIComponent(detail)+
    "&location="+encodeURIComponent(lieu)+
    /* invité pré-rempli : Google envoie l'invitation à l'enregistrement */
    (invite?("&add="+encodeURIComponent(invite)):"");
}

}

function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){

  } else toast("Copie non supportée");
}
function api(payload){
  payload.key=KEY;

      if(r.status===401) throw {auth:true};
      return r.json().then(function(j){ if(!r.ok) throw ((j&&j.error)||("HTTP "+r.status)); return j; });
    });
}

        marque+'<span class="nm">'+esc(it.nm)+'</span><span class="ct">'+n+'</span></button>';
    }).join("");
    return '<div class="navgroup"><div class="label">'+esc(g.label)+'</div><div class="nav">'+items+'</div></div>';
  }).join("");

  document.getElementById("foot").innerHTML=
    (counts.tous!=null?('<div>'+counts.tous+' hôtels ciblés</div><div>'+(counts.ouvert||0)+' ont ouvert le guidebook</div>'):'')+

function sortRowHtml(r,i,list){
  var type=SORT_TYPE[r.f]||"text", lab=DIR_LABEL[type]||DIR_LABEL.text;

  var fieldOpts=SORT_FIELDS.map(function(f){
    var taken=false;
    for(var j=0;j<list.length;j++) if(j!==i&&list[j].f===f[0]){taken=true;break;}
    return '<option value="'+f[0]+'"'+(r.f===f[0]?' selected':'')+(taken?' disabled':'')+'>'+esc(f[1])+'</option>';
  }).join("");

  var dirOpts='<option value="asc"'+(r.d==="asc"?' selected':'')+'>'+esc(lab[0])+'</option>'+
              '<option value="desc"'+(r.d!=="asc"?' selected':'')+'>'+esc(lab[1])+'</option>';

  return '<div class="sortrow" data-rule="'+i+'">'+
    '<span class="rk">'+(i+1)+'</span>'+

/* Prochaine échéance : rappel, RDV ou fin d'attente. C'est la colonne
   qui pilote la journée, donc elle dit AUSSI de quel type d'échéance
   il s'agit, et vire au rouge quand c'est en retard. */
var DUE_LABEL={rappel:"Rappel",rdv:"RDV",attente:"Attente"};
function dueChip(r){
  if(!r.due_label) return '<span class="muted">—</span>';
  var d=parseInt(r.due_days,10), cls=r.due_kind||"rappel", quand;
  if(isNaN(d))    quand=r.due_label;
  else if(d<0)    quand="En retard";
  else if(d===0)  quand="Aujourd'hui";
  else if(d===1)  quand="Demain";
  else if(d<7)    quand="Dans "+d+" j";
  else            quand=String(r.due_label).split(" à ")[0];
  return '<span class="due k-'+esc(cls)+(d<0?" late":"")+'" title="'+esc(r.due_label)+'">'+
    '<span class="ty">'+esc(DUE_LABEL[cls]||"Rappel")+'</span>'+
    '<span class="dt">'+esc(quand)+'</span></span>';
}

/* Dernier mail envoyé, lisible d'un coup d'oeil : aujourd'hui / hier /
   il y a N j / la date. La couleur dit la fraîcheur, le rouge un rebond. */
function sentChip(r){
  if(!r.last_sent_label) return '<span class="muted">—</span>';
  var d=parseInt(r.last_sent_days,10), txt, cls="";
  if(isNaN(d))     txt=r.last_sent_label;
  else if(d===0)   txt="Aujourd'hui";
  else if(d===1)   txt="Hier";
  else if(d<7)     txt="Il y a "+d+" j";
  else             txt=String(r.last_sent_label).split(" à ")[0];

  /* Un refus explicite prime sur tout le reste : c'est l'information
     qui doit t'empêcher de décrocher le téléphone. */
  if(r.has_refusal) return '<span class="refus" title="'+esc(r.reply_excerpt||"")+'">'+I.ban+
    '<span class="dt">A refusé</span></span>';

  if(r.has_bounce)      cls=" bad";
  else if(r.has_reply)  cls=" rep";
  else if(!isNaN(d)&&d<=1) cls=" fresh";
  else if(!isNaN(d)&&d<7)  cls=" warm";

  var nb = r.has_bounce ? '<span class="nb">rebond</span>'
         : r.has_reply  ? '<span class="nb">a répondu</span>'
         : (r.emails_sent>1 ? '<span class="nb">'+r.emails_sent+' mails</span>' : "");

  return '<span class="sent'+cls+'" title="'+esc(r.last_sent_label||"")+'">'+
    '<span class="pt"></span><span class="dt">'+esc(txt)+'</span>'+nb+'</span>';
}

/* ============================================================
   RENDU — CALENDRIER
   ============================================================ */
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var DOWS=["lun","mar","mer","jeu","ven","sam","dim"];
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function gridStart(d){          /* lundi de la semaine contenant le 1er du mois */
  var f=new Date(d.getFullYear(),d.getMonth(),1);
  var off=(f.getDay()+6)%7;     /* 0 = lundi */
  return new Date(f.getFullYear(),f.getMonth(),1-off);
}
function loadCalendar(){
  var start=gridStart(calCursor);
  var end=new Date(start); end.setDate(end.getDate()+41);
  document.getElementById("calBody").innerHTML='<div class="cal-empty">Chargement…</div>';
  return api({action:"calendar",from:ymd(start),to:ymd(end)}).then(function(d){
    calRows=Array.isArray(d)?d:[];
    renderCalendar();
  }).catch(function(e){
    if(e&&e.auth){showLogin("Mot de passe incorrect.");return;}
    document.getElementById("calBody").innerHTML='<div class="cal-empty">Erreur : '+esc(String(e))+'</div>';
  });
}
function renderCalendar(){
  document.getElementById("calTitle").textContent=MOIS[calCursor.getMonth()]+" "+calCursor.getFullYear();

  var byDay={};
  calRows.forEach(function(r,i){ (byDay[r.jour]=byDay[r.jour]||[]).push(i); });

  var start=gridStart(calCursor), today=ymd(new Date()), cells="";
  for(var i=0;i<42;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var key=ymd(d), out=(d.getMonth()!==calCursor.getMonth()), isToday=(key===today);
    var idx=byDay[key]||[];
    var evs=idx.slice(0,3).map(function(k){
      var r=calRows[k];
      var cls=(r.kind==="rdv"?("rdv "+(r.etat||"")):(r.etat||r.callback_state||""));
      return '<button class="cal-ev '+esc(cls)+'" data-cal="'+k+'">'+
        '<span class="h">'+esc(r.heure||"")+'</span><span class="n">'+esc(r.hotel_name)+'</span></button>';
    }).join("");
    if(idx.length>3) evs+='<div class="cal-more">+'+(idx.length-3)+' autre'+(idx.length-3>1?'s':'')+'</div>';
    cells+='<div class="cal-cell'+(out?" out":"")+(isToday?" today":"")+'">'+
      '<div class="cal-num"><span>'+d.getDate()+'</span>'+(idx.length?('<span class="cal-n">'+idx.length+'</span>'):'')+'</div>'+
      evs+'</div>';
  }
  document.getElementById("calBody").innerHTML=
    '<div class="cal"><div class="cal-dows">'+DOWS.map(function(x){return '<div>'+x+'</div>';}).join("")+'</div>'+
    '<div class="cal-grid">'+cells+'</div></div>'+
    (calRows.length?'':'<div class="cal-empty">Aucun rappel programmé sur cette période.</div>');
}

/* ============================================================
   PANNEAU D'APPEL
   Un appel se termine toujours par un résultat, et le résultat
   entraîne la suite (rappel, RDV, attente, statut). Une seule
   requête, pas de statut posé d'un côté et de date oubliée de l'autre.
   ============================================================ */
var callState={id:null,outcome:null,record:null};

function pad2(n){return (n<10?"0":"")+n;}
function localInput(d){
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+
         "T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
/* raccourcis de date : ce qu'on dit vraiment au téléphone */
function quickWhen(kind){
  var d=new Date();
  if(kind==="1h"){ d.setHours(d.getHours()+1); }
  else if(kind==="demain"){ d.setDate(d.getDate()+1); d.setHours(9,30,0,0); }
  else if(kind==="apresdemain"){ d.setDate(d.getDate()+2); d.setHours(9,30,0,0); }
  else if(kind==="lundi"){ var j=(8-d.getDay())%7||7; d.setDate(d.getDate()+j); d.setHours(9,30,0,0); }
  else if(kind==="semaine"){ d.setDate(d.getDate()+7); d.setHours(9,30,0,0); }
  else if(kind==="2sem"){ d.setDate(d.getDate()+14); d.setHours(9,30,0,0); }
  return localInput(d);
}

function outcomeList(){
  var rec=callState.record;
  return (rec&&rec.outcomes&&rec.outcomes.length)?rec.outcomes:[
    {code:"pas_repondu",label:"Pas de réponse",besoin:"rappel",couleur:"neutral"},
    {code:"rappeler",label:"À rappeler plus tard",besoin:"rappel",couleur:"rappel"},
    {code:"decideur",label:"Transmis au décideur",besoin:"attente",couleur:"attente"},
    {code:"interesse",label:"Intéressé",besoin:"rappel",couleur:"eng"},
    {code:"rdv",label:"RDV pris",besoin:"rdv",couleur:"rdv"},
    {code:"pas_interesse",label:"Pas intéressé",besoin:null,couleur:"non"},
    {code:"mauvais_num",label:"Mauvais numéro",besoin:null,couleur:"inj"},
    {code:"client",label:"Signé",besoin:null,couleur:"rdv"}
  ];
}
function outcomeBy(code){
  var l=outcomeList();
  for(var i=0;i<l.length;i++) if(l[i].code===code) return l[i];
  return null;
}

/* Des mots-clés, pas des phrases : ça se lit en parlant.
   L'explication reste accessible au survol. */
function pitchHtml(pi){
  if(!pi) return "";
  var lev=(pi.leviers||[]), fa=(pi.faits||[]);
  if(!lev.length && !fa.length && !pi.decideur) return "";
  return '<div class="pitch">'+
    (pi.decideur?('<div class="ask">Demander <b>'+esc(pi.decideur)+'</b></div>'):'')+
    (lev.length?('<div class="lev">'+lev.map(function(l){
       return '<span class="tag" title="'+esc(l.d||"")+'">'+esc(l.t)+'</span>';
     }).join("")+'</div>'):'')+
    (fa.length?('<div class="facts">'+fa.map(function(f){
       return '<span>'+esc(f)+'</span>';
     }).join("")+'</div>'):'')+
  '</div>';
}

   FIL DES EMAILS (Smartlead)
   ============================================================ */
var recordCache={};

/* Le corps arrive en HTML depuis Smartlead : on le ramène en texte
   avant de l'afficher, jamais d'injection dans la page. */
function htmlToText(h){
  var s=String(h==null?"":h);
  s=s.replace(/<br\s*\/?>/gi,"\n")
     .replace(/<\/(div|p|tr|li|h[1-6])>/gi,"\n")
     .replace(/<li[^>]*>/gi,"• ")
     .replace(/<[^>]*>/g," ");
  s=s.replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<")
     .replace(/&gt;/gi,">").replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'");
  return s.replace(/[ \t]+/g," ").replace(/[ \t]*\n[ \t]*/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function ago(d){
  d=parseInt(d,10);
  if(isNaN(d)) return "";
  if(d===0) return "aujourd'hui";
  if(d===1) return "hier";
  if(d<7)  return "il y a "+d+" jours";
  if(d<14) return "il y a 1 semaine";
  if(d<31) return "il y a "+Math.round(d/7)+" semaines";
  return "il y a "+Math.round(d/30)+" mois";
}
function kindOf(m){
  if(m.kind) return m.kind;
  return m.direction==="reply"?"reply":"sent";
}
function seqWord(n){
  n=parseInt(n,10);
  if(isNaN(n)||n<=1) return "Premier mail";
  return "Relance "+(n-1);
}
function seqLabel(m){
  var k=kindOf(m);
  if(k==="bounce") return "Rebond";
  if(k==="auto")   return "Réponse auto";
  if(k==="reply")  return "Réponse";
  var n=parseInt(m.seq,10);
  if(isNaN(n)||n<=1) return "Premier mail";
  return "Relance "+(n-1);
}

function renderMails(d){
  var host=document.getElementById("mailThread");
  if(!host) return;
  var msgs=(d&&d.messages)||[], lead=(d&&d.lead)||null;

  if(!msgs.length){
    host.innerHTML='<p class="desc" style="margin:0">'+
      (lead&&lead.found===false
        ? 'Cette adresse n\'est dans aucune campagne Smartlead. Aucun email ne lui a été envoyé.'
        : 'Aucun email envoyé à ce prospect pour le moment.')+'</p>';
    return;
  }

  var sent=[],last=null,reply=null,bounce=null;
  for(var i=0;i<msgs.length;i++){
    var k=kindOf(msgs[i]);
    if(k==="sent"){sent.push(msgs[i]);last=msgs[i];}
    else if(k==="bounce"){bounce=msgs[i];}
    else if(k==="reply"){reply=msgs[i];}
  }

  /* La ligne que tu lis avant de décrocher. Un rebond ou une réponse
     automatique ne comptent pas comme une réponse du prospect. */
  var sum='';
  if(bounce){
    sum='<div class="mailsum bad"><span class="big">L\'adresse ne reçoit pas</span>'+
        '<span class="sub">Le mail est revenu en erreur le '+esc(bounce.sent_label||"")+'. Corrigez l\'adresse plus haut.</span></div>';
  } else if(reply){
    sum='<div class="mailsum eng"><span class="big">Ce prospect a répondu</span>'+
        '<span class="sub">'+esc(reply.sent_label||"")+'</span></div>';
  } else if(last){
    sum='<div class="mailsum"><span class="big">'+esc(seqLabel(last))+' envoyé '+esc(ago(last.days_ago))+'</span>'+
        '<span class="sub">'+esc(last.sent_label||"")+' · '+sent.length+' email'+(sent.length>1?"s":"")+' au total</span></div>';
  }

  host.innerHTML=sum+msgs.map(function(m,i){
    var txt=htmlToText(m.body);
    var long=(txt.length>230||txt.indexOf("\n\n")>-1);
    var k=kindOf(m);
    return '<div class="mailitem'+(k!=="sent"?(" "+k):"")+'" data-mi="'+i+'">'+
      '<div class="mh"><span class="tag">'+esc(seqLabel(m))+'</span>'+
        '<span class="when">'+esc(m.sent_label||"")+(m.days_ago!=null?(" · "+esc(ago(m.days_ago))):"")+'</span></div>'+
      (m.subject?'<div class="subj">'+esc(m.subject)+'</div>':'')+
      '<div class="bodytxt'+(long?" long":"")+'">'+esc(txt)+'</div>'+
      (long?'<button class="more" data-mimore="'+i+'">Voir le message entier</button>':'')+
    '</div>';
  }).join("");
}

/* Une seule requête ramène argumentaire, emails et appels.
   On charge d'abord SANS synchroniser Smartlead : c'est instantané.
   La synchro (qui fait des appels réseau côté serveur) part ensuite en
   arrière-plan, pour ne jamais bloquer l'affichage de la fiche. */
var syncedOnce={};
function loadRecord(id,force){
  if(!force&&recordCache[id]){ paintRecord(id); backgroundSync(id); return; }
  setLoading(id, force?"Synchronisation avec Smartlead…":"Chargement…");
  api({action:"record",id:id,sync:force===true}).then(function(d){
    recordCache[id]=d;
    if(force) syncedOnce[id]=true;
    if(callState.id===id){ callState.record=d; renderCall(); }
    paintRecord(id);
    if(force) toast("Historique à jour");
    else backgroundSync(id);
  }).catch(function(e){
    if(e&&e.auth){showLogin("Mot de passe incorrect.");return;}
    setError(id, String((e&&e.message)||e||"erreur"));
  });
}
/* Rafraîchit l'historique email une seule fois par fiche et par session,
   sans jamais laisser l'utilisateur devant un écran d'attente. */
function backgroundSync(id){
  if(syncedOnce[id]) return;
  syncedOnce[id]=true;
  api({action:"record",id:id,sync:true}).then(function(d){
    recordCache[id]=d;
    if(callState.id===id){ callState.record=d; renderCall(); }
    paintRecord(id);
  }).catch(function(){ /* la fiche reste affichée avec ce qu'on avait */ });
}
function setLoading(id,txt){
  ["mailThread","callHist","pitchBox"].forEach(function(k){
    var el=document.getElementById(k);
    if(el) el.innerHTML='<p class="desc" style="margin:0">'+esc(txt)+'</p>';
  });
}
function setError(id,msg){
  ["mailThread","callHist","pitchBox"].forEach(function(k){
    var el=document.getElementById(k);
    if(el) el.innerHTML='<p class="desc" style="margin:0">Impossible de charger. '+
      '<button class="linkbtn" data-recsync="'+esc(id)+'">Réessayer</button></p>';
  });
  toast("Fiche partiellement chargée");
}
/* Remplit les blocs dépendants du chargement asynchrone. */
function paintRecord(id){
  var r=rows[cursor]; if(!r||r.id!==id) return;
  var d=recordCache[id]||{};
  renderMails(d.emails||{messages:[]});
  var hc=document.getElementById("callHist");
  if(hc) hc.innerHTML=callsHtml(d.calls||[]);
  var hp=document.getElementById("pitchBox");
  if(hp) hp.innerHTML=pitchHtml(d.pitch)||'<p class="desc" style="margin:0">Pas assez d\'informations sur cet établissement.</p>';
}

function callsHtml(list){
  if(!list.length) return '<p class="desc" style="margin:0">Aucun appel passé pour le moment.</p>';
  return list.map(function(c){
    return '<div class="callitem"><span class="dot2 c-'+esc(c.couleur||"neutral")+'"></span>'+
      '<div class="cx"><div class="c1">'+esc(c.label||c.outcome)+'</div>'+
      '<div class="c2">'+esc(c.quand||"")+(c.jours!=null?(" · "+esc(ago(c.jours))):"")+'</div>'+
      (c.note?('<div class="c3">'+esc(c.note)+'</div>'):'')+'</div></div>';
  }).join("");
}

var mailTimer={};
/* Corrige l'adresse puis réinjecte le prospect dans la campagne active.
   Action à effet réel : un mail part vraiment, donc on confirme d'abord. */
function resendTo(id){
  var input=document.querySelector('[data-email="'+id+'"]');
  var v=input?input.value.trim():"";
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v)){toast("Adresse email invalide");if(input)input.focus();return;}

  var r=null;for(var i=0;i<rows.length;i++){if(rows[i].id===id){r=rows[i];break;}}
  var nom=r?r.hotel_name:"ce prospect";
  if(!window.confirm("Envoyer le mail de prospection à "+v+" pour "+nom+" ?\n\nLa séquence repartira du premier message sur cette adresse."))return;

  /* la relance enregistre déjà l'adresse : on annule la sauvegarde
     différée de la saisie, sinon son toast masque le vrai résultat */
  clearTimeout(mailTimer[id]);

  var btn=document.querySelector('[data-resend="'+id+'"]');
  if(btn){btn.disabled=true;btn.textContent="Envoi en cours…";}

  api({action:"resend",id:id,email:v}).then(function(d){
    toast((d&&d.message)||((d&&d.ok)?"Relance programmée":"Échec de la relance"));
    if(d&&d.ok){
      delete recordCache[id];
      load().then(function(){ if(cursor>=0) renderRecord(); });
    } else if(btn){ btn.disabled=false; btn.innerHTML=I.send+"Corriger et relancer"; }
  },function(e){
    if(e&&e.auth){showLogin("Session expirée.");return;}
    toast("Erreur");
    if(btn){btn.disabled=false;btn.innerHTML=I.send+"Corriger et relancer";}
  });
}

document.addEventListener("click",function(e){
  var t=e.target;

  /* ---- panneau d'appel ---- */
  if(t.closest("#openCall")||t.closest("#openCall2")){ openCall(); return; }
  if(t.closest("#callCancel")){ closeCall(); return; }
  if(t.id==="callwrap"){ closeCall(); return; }
  if(t.closest("#callSave")){ saveCall(); return; }
  if(t.closest("#callCopy")){
    var rr=rows[cursor];
    if(rr&&rr.phone_primary){
      copyText(rr.phone_primary,"Numéro copié");
      var cb=document.getElementById("callCopy");
      if(cb){cb.classList.add("done");cb.innerHTML=I.copy+"Copié";}
    }
    return;
  }
  var ob=t.closest("[data-outcome]");
  if(ob){
    callState.outcome=ob.getAttribute("data-outcome");
    renderCall();
    /* on pré-remplit la date la plus probable pour ce résultat */
    var oc=outcomeBy(callState.outcome), w=document.getElementById("callWhen");
    if(w&&!w.value&&oc&&oc.besoin){
      w.value=quickWhen(oc.besoin==="attente"?"semaine":oc.besoin==="rdv"?"apresdemain":"demain");
    }
    return;
  }
  var qb=t.closest("[data-quick]");
  if(qb){
    var wi=document.getElementById("callWhen");
    if(wi) wi.value=quickWhen(qb.getAttribute("data-quick"));
    return;
  }

  /* ---- panneau de tri ---- */
  if(t.closest("#sortBtn")){ sortOpen=!sortOpen; renderFilters(); return; }
  if(sortOpen && !t.closest("#sortPop")){ sortOpen=false; renderFilters(); }

  if(t.closest("#sortReset")){ resetSorts(view); page=1; renderFilters(); load(); return; }

  if(t.closest("#sortAdd")){
    var la=sortsFor(view).slice(), nf=freeField(la);
    if(nf){ la.push({f:nf,d:(SORT_TYPE[nf]==="text"||SORT_TYPE[nf]==="statut")?"asc":"desc"}); applySorts(la); }
    return;
  }
  var sup=t.closest("[data-sup]");
  if(sup){
    var iu=parseInt(sup.getAttribute("data-sup"),10), lu=sortsFor(view).slice();
    if(iu>0){ var tmp=lu[iu-1]; lu[iu-1]=lu[iu]; lu[iu]=tmp; applySorts(lu); }
    return;
  }
  var sdn=t.closest("[data-sdown]");
  if(sdn){
    var id2=parseInt(sdn.getAttribute("data-sdown"),10), ld=sortsFor(view).slice();
    if(id2<ld.length-1){ var tm2=ld[id2+1]; ld[id2+1]=ld[id2]; ld[id2]=tm2; applySorts(ld); }
    return;
  }
  var sdl=t.closest("[data-sdel]");
  if(sdl){
    var ix=parseInt(sdl.getAttribute("data-sdel"),10), lx=sortsFor(view).slice();
    lx.splice(ix,1); applySorts(lx); return;
  }

  if(t.closest("#logout")){localStorage.removeItem(LSK);KEY="";showLogin("");return;}

  var md=t.closest("[data-mode]");
  if(md){closeRecord();setMode(md.getAttribute("data-mode"));return;}

  var nav=t.closest("[data-view]");
  if(nav){view=nav.getAttribute("data-view");page=1;dep="";closeRecord();
    if(mode!=="liste"){setMode("liste");}else{load();} return;}

  if(t.closest("#calPrev")){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);loadCalendar();return;}
  if(t.closest("#calNext")){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);loadCalendar();return;}
  if(t.closest("#calToday")){calCursor=new Date();loadCalendar();return;}

  var ce=t.closest("[data-cal]");
  if(ce){                       /* ouvre la fiche ; les flèches parcourent alors les rappels */
    rows=calRows; total=calRows.length; page=1;
    openRecord(parseInt(ce.getAttribute("data-cal"),10)); return;
  }

  if(t.closest("#clearFilters")){
    resetSorts(view);dep="";page=1;renderFilters();load();return;
  }

  var stBtn=t.closest("[data-status]");
  if(stBtn){setStatus(stBtn.getAttribute("data-status"),stBtn.getAttribute("data-s"));return;}

  var ecl=t.closest("[data-echclear]");
  if(ecl){
    var rr2=rows[cursor];
    if(rr2&&rr2.due_kind==="rdv") setMeeting(ecl.getAttribute("data-echclear"),"");
    else setCallback(ecl.getAttribute("data-echclear"),"");
    return;
  }

  var cbc=t.closest("[data-cbclear]");
  if(cbc){ setCallback(cbc.getAttribute("data-cbclear"),""); return; }

  var mtc=t.closest("[data-mtclear]");
  if(mtc){ setMeeting(mtc.getAttribute("data-mtclear"),""); return; }

  var msy=t.closest("[data-recsync]");
  if(msy){loadRecord(msy.getAttribute("data-recsync"),true);return;}

  var mmo=t.closest("[data-mimore]");
  if(mmo){
    var it=mmo.closest(".mailitem");
    if(it){ it.classList.add("open"); mmo.remove(); }
    return;
  }

  var rsd=t.closest("[data-resend]");
  if(rsd){resendTo(rsd.getAttribute("data-resend"));return;}

  var rs=t.closest("[data-reset]");
  if(rs){resetOpen(rs.getAttribute("data-reset"));return;}

  var rel=t.closest("[data-relance]");
  if(rel){
    var id=rel.getAttribute("data-relance"),rec=null;
    for(var i=0;i<rows.length;i++){if(rows[i].id===id){rec=rows[i];break;}}
    copyText(RELANCE(rec?rec.hotel_name:"votre établissement"),"Relance copiée");return;
  }

  var cp=t.closest("[data-copy]");
  if(cp){copyText(cp.getAttribute("data-copy"),"Copié");return;}

  if(t.closest("#prev")){if(page>1){page--;closeRecord();load();}return;}
  if(t.closest("#next")){page++;closeRecord();load();return;}
  if(t.closest("#nextRec")){nextRecord();return;}
  if(t.closest("#prevRec")){prevRecord();return;}
  if(t.closest("#closeRec")){closeRecord();return;}
  if(t.id==="overlay"){closeRecord();return;}       /* clic sur les bords floutés */

  var row=t.closest("[data-idx]");
  if(row){openRecord(parseInt(row.getAttribute("data-idx"),10));return;}
});

document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toUpperCase();
  var typing=(tag==="INPUT"||tag==="TEXTAREA");
  if(e.key==="Escape"&&document.getElementById("callwrap").classList.contains("open")){
    closeCall();return;
  }
  if(cursor>=0){
    if(e.key==="Escape"&&!typing){closeRecord();return;}
    if(typing)return;
    if(e.key==="ArrowRight"){e.preventDefault();nextRecord();}
    else if(e.key==="ArrowLeft"){e.preventDefault();prevRecord();}
    return;
  }
  if(!typing&&(e.key==="/"||e.key==="k"&&(e.metaKey||e.ctrlKey))){e.preventDefault();document.getElementById("q").focus();}
  var r=e.target.closest&&e.target.closest("[data-idx]");
  if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openRecord(parseInt(r.getAttribute("data-idx"),10));}
});

document.addEventListener("change",function(e){
  if(e.target.id==="recStatus"){
    var rs=rows[cursor];
    if(rs) setStatus(rs.id, e.target.value);
    return;
  }
  var sf=e.target.closest("[data-sfield]");
  if(sf){
    var i1=parseInt(sf.getAttribute("data-sfield"),10), l1=sortsFor(view).slice();
    var nf1=e.target.value;
    /* le champ change : on repart sur le sens naturel de son type */
    l1[i1]={f:nf1,d:(SORT_TYPE[nf1]==="text"||SORT_TYPE[nf1]==="statut")?"asc":"desc"};
    applySorts(l1);return;
  }
  var sd=e.target.closest("[data-sdir]");
  if(sd){
    var i2=parseInt(sd.getAttribute("data-sdir"),10), l2=sortsFor(view).slice();
    if(l2[i2]){ l2[i2]={f:l2[i2].f,d:(e.target.value==="asc"?"asc":"desc")}; applySorts(l2); }
    return;
  }
  if(e.target.id==="selDep"){ dep=e.target.value;page=1;load();return; }
  var cb=e.target.closest("[data-cb]");
  if(cb){ setCallback(cb.getAttribute("data-cb"),cb.value); return; }

  var mt=e.target.closest("[data-mt]");
  if(mt){ setMeeting(mt.getAttribute("data-mt"),mt.value,45); return; }
});

var qTimer;
document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    query=e.target.value;page=1;
    clearTimeout(qTimer);qTimer=setTimeout(load,280);return;
  }
  var ta=e.target.closest("[data-notes]");
  if(ta){saveNotes(ta.getAttribute("data-notes"),ta.value);return;}
  var em=e.target.closest("[data-email]");
  if(em){setEmail(em.getAttribute("data-email"),em.value);return;}
  var mm=e.target.closest("[data-mtmail]");
  if(mm)setMeetingEmail(mm.getAttribute("data-mtmail"),mm.value);
});

/* ============================================================
   LOGIN
   ============================================================ */
function showLogin(msg){
  closeRecord();
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("loginErr").textContent=msg||"";
  var p=document.getElementById("pass");p.value="";p.focus();
}
function enterApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="grid";
}
function tryLogin(){
  var v=document.getElementById("pass").value.trim();
  if(!v)return;
  KEY=v;localStorage.setItem(LSK,v);
  document.getElementById("loginErr").textContent="Vérification…";
  api({action:"ping"}).then(function(){enterApp();load();})
    .catch(function(e){
      if(e&&e.auth){localStorage.removeItem(LSK);KEY="";showLogin("Mot de passe incorrect.");}
      else showLogin("Erreur réseau : "+String(e));
    });
}
document.getElementById("loginBtn").addEventListener("click",tryLogin);
document.getElementById("pass").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin();});

if(KEY){
  enterApp();
  api({action:"ping"}).then(function(){load();})
    .catch(function(e){ if(e&&e.auth){KEY="";localStorage.removeItem(LSK);showLogin("");} else load(); });
}else showLogin("");
</script>
