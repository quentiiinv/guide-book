<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRM SolvIA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23111114%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Inter%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap">
<style>
  :root{
    --bg:#ffffff; --sidebar:#fbfbfc; --panel:#ffffff; --panel-2:#f6f6f8;
    --ink:#111114; --ink-2:#565660; --ink-3:#9195a0;
    --line:#ececef; --line-2:#e2e2e6; --hover:#f5f5f7;
    --btn:#111114; --btn-ink:#ffffff; --ring:#b7b9c0;
    --open:#b45309; --open-bg:#fdf3e7;
    --rappel:#9a7209; --rappel-bg:#fbf4dc;
    --rdv:#177245; --rdv-bg:#e6f3ec;
    --non:#c0392b; --non-bg:#fbeceb;
    --inj:#5b5650; --inj-bg:#f1f0ee;
    --link:#2563eb;
    --shadow-sm:0 1px 2px rgba(17,17,20,.06);
    --shadow-lg:0 10px 40px -12px rgba(17,17,20,.28);
    --r:10px;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
  .tnum{font-variant-numeric:tabular-nums}
  a{color:var(--link);text-decoration:none} button{font-family:inherit;cursor:pointer}
  svg{display:block}

  /* Login */
  .login{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .login .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:32px 30px;width:100%;max-width:360px}
  .login .logo{width:36px;height:36px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:18px}
  .login h2{margin:0 0 4px;font-size:20px;font-weight:600}
  .login p{margin:0 0 18px;color:var(--ink-3);font-size:13px}
  .login input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--ink);font:inherit;outline:none;margin-bottom:10px}
  .login input:focus{border-color:var(--ring);background:var(--panel)}
  .login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-weight:600;font:inherit}
  .login .err{color:var(--non);font-size:13px;margin:2px 0 10px;min-height:18px}

  .app{display:grid;grid-template-columns:230px 1fr;height:100vh}
  /* Sidebar */
  .side{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:600;font-size:15px}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .brand .sub{color:var(--ink-3);font-weight:450;font-size:12px}
  .navlabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;color:var(--ink-2);font-weight:450;border:0;background:transparent;text-align:left;width:100%}
  .navitem:hover{background:var(--hover);color:var(--ink)}
  .navitem.on{background:#ececed;color:var(--ink);font-weight:600}
  .navitem .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
  .navitem .label{flex:1} .navitem .cnt{color:var(--ink-3);font-weight:500;font-size:12.5px}
  .dot-open{background:var(--open)}.dot-rappel{background:var(--rappel)}.dot-rdv{background:var(--rdv)}.dot-non{background:var(--non)}.dot-inj{background:var(--inj)}
  .side-foot{margin-top:auto;padding:12px 9px 2px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;line-height:1.6}
  .side-foot a{color:var(--ink-3);text-decoration:underline}

  .main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .topbar{border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;gap:16px;flex:none}
  .h-title{font-size:15.5px;font-weight:600;margin:0;white-space:nowrap}
  .h-title .muted{color:var(--ink-3);font-weight:450;margin-left:8px;font-size:13px}
  .search{flex:1;max-width:400px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:8px 12px}
  .search:focus-within{border-color:var(--ring)}
  .search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
  .search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8;flex:none}
  .scroll{flex:1;overflow-y:auto;padding:16px 24px 60px}
  .wrap{max-width:1080px;margin:0 auto}

  /* Table */
  .thead,.trow{display:grid;grid-template-columns:1fr 120px 140px;align-items:center;gap:14px;padding:0 16px}
  .thead{height:38px;color:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  .trow{min-height:56px;border-bottom:1px solid var(--line);border-radius:0;transition:background .08s}
  .trow:hover{background:var(--hover)}
  .cell-name{min-width:0}
  .nm{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
  .nm .odot{width:6px;height:6px;border-radius:50%;background:var(--open);flex:none}
  .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub2{color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .rate{color:var(--ink-2);font-size:13px;white-space:nowrap} .rate b{color:var(--ink);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:500;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
  .chip .cd{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .chip[data-v="rappel"]{background:var(--rappel-bg);color:var(--rappel)} .chip[data-v="rappel"] .cd{background:var(--rappel)}
  .chip[data-v="rdv"]{background:var(--rdv-bg);color:var(--rdv)} .chip[data-v="rdv"] .cd{background:var(--rdv)}
  .chip[data-v="non"]{background:var(--non-bg);color:var(--non)} .chip[data-v="non"] .cd{background:var(--non)}
  .chip[data-v="injoignable"]{background:var(--inj-bg);color:var(--inj)} .chip[data-v="injoignable"] .cd{background:var(--inj)}
  .state{text-align:center;color:var(--ink-3);padding:56px 0}
  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--ink-3);font-size:13px}
  .pager .pg{display:flex;gap:8px}
  .pager button{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;font:inherit}
  .pager button:disabled{opacity:.4}

  /* Record modal (plein écran) */
  .overlay{position:fixed;inset:0;background:rgba(17,17,20,.32);backdrop-filter:blur(2px);z-index:100;display:none;align-items:stretch;justify-content:center}
  .overlay.open{display:flex}
  .record{background:var(--panel);width:100%;max-width:860px;margin:0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slidein .18s ease}
  @keyframes slidein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rec-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex:none}
  .rec-nav{display:flex;gap:4px}
  .navbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .navbtn:hover{background:var(--hover);color:var(--ink)} .navbtn:disabled{opacity:.35}
  .navbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
  .rec-pos{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
  .rec-close{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .rec-close:hover{background:var(--hover);color:var(--ink)} .rec-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
  .rec-body{overflow-y:auto;padding:26px 30px 40px}
  .rec-body .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .rec-title h2{font-family:"Inter";font-weight:600;font-size:24px;margin:0;letter-spacing:-.02em}
  .rec-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--ink-2);font-size:13.5px}
  .rec-meta .stars{color:var(--open);font-weight:600}
  .rec-open{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 11px;border-radius:8px;background:var(--open-bg);color:var(--open);font-size:12.5px;font-weight:600}
  .rec-open .cd{width:6px;height:6px;border-radius:50%;background:currentColor}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:4px}
  .flab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .fval{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);min-width:0}
  .fval .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
  .icbtn:hover{background:var(--hover);color:var(--ink)} .icbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:500;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);text-decoration:none}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
  .btn.primary:hover{opacity:.9}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .btn.primary svg{stroke:var(--btn-ink)}
  .btn.ghost-danger{color:var(--non);border-color:var(--non-bg);background:var(--non-bg)}
  .btn.ghost-danger:hover{background:#f7ded9}

  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .segbtn{padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);font-size:13px;font-weight:500}
  .segbtn:hover{background:var(--hover)} .segbtn.on{border-color:var(--ring);color:var(--ink);font-weight:600}
  .segbtn.on[data-v="rappel"]{background:var(--rappel-bg);color:var(--rappel);border-color:transparent}
  .segbtn.on[data-v="rdv"]{background:var(--rdv-bg);color:var(--rdv);border-color:transparent}
  .segbtn.on[data-v="non"]{background:var(--non-bg);color:var(--non);border-color:transparent}
  .segbtn.on[data-v="injoignable"]{background:var(--inj-bg);color:var(--inj);border-color:transparent}

  .notes-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .notes-h .flab{margin:0}
  .saved{font-size:12px;color:var(--rdv);opacity:0;transition:opacity .2s}
  textarea.notes{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:12px 14px;outline:none;line-height:1.6}
  textarea.notes:focus{border-color:var(--ring)}
  .desc{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0}
  .sep{height:1px;background:var(--line);margin:2px 0}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:9px;font-weight:500;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:300;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--line);padding:10px;overflow:visible}
    .brand{padding:0 8px 0 4px} .navlabel{display:none} .side-foot{display:none}
    .nav{flex-direction:row;flex-wrap:wrap;gap:6px} .navitem{width:auto;padding:7px 10px;border:1px solid var(--line-2)}
    .thead{display:none} .trow{grid-template-columns:1fr;grid-auto-rows:auto;padding:12px 12px;gap:4px}
    .cell-rate,.cell-status{padding-left:14px} .scroll{padding:12px}
    .rec-body{padding:20px}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <div class="logo">S</div>
    <h2>CRM SolvIA</h2>
    <p>Espace privé. Entrez le mot de passe d'accès.</p>
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">Entrer</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand"><span class="logo">S</span><span>SolvIA<br><span class="sub">Prospection</span></span></div>
    <div class="navlabel">Vues</div>
    <div class="nav" id="nav"></div>
    <div class="side-foot" id="foot"><a id="logout">Se déconnecter</a></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 class="h-title">Prospects<span class="muted" id="count"></span></h1>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="q" type="search" placeholder="Rechercher un établissement, une ville, un département…" autocomplete="off">
      </label>
    </div>
    <div class="scroll">
      <div class="wrap">
        <div class="thead"><div>Établissement</div><div>Note</div><div>Statut</div></div>
        <div id="rows"><div class="state">Chargement…</div></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<!-- Fiche prospect plein écran -->
<div class="overlay" id="overlay">
  <div class="record">
    <div class="rec-head">
      <div class="rec-nav">
        <button class="navbtn" id="prevRec" title="Précédent (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="navbtn" id="nextRec" title="Suivant (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <span class="rec-pos" id="recPos"></span>
      <button class="rec-close" id="closeRec" title="Fermer (Échap)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="rec-body"><div class="inner" id="recInner"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPA_URL="https://nocifyylfyafbfppmykp.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vY2lmeXlsZnlhZmJmcHBteWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTExNTIsImV4cCI6MjEwMTM2NzE1Mn0.nGxJn9K-1CXehlPE8-rJdK83x9l4G-HdMNMhoyp3OS0";
var FN=SUPA_URL+"/functions/v1/crm";
var LSK="solvia_crm_key";

var PER=20, page=1, filter="tous", query="", openIdx=-1;
var rows=[], counts={}, total=0, KEY=localStorage.getItem(LSK)||"";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tel(p){return "tel:"+String(p).replace(/[^+0-9]/g,"");}
function gidUrl(slug){return "https://guide.solvia.pro/?slug="+encodeURIComponent(slug)+"&nc=1";}
function mapsUrl(r){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.hotel_name+" "+(r.city||""));}
function stars(hc){if(!hc)return"";var m=String(hc).match(/(\d)/);return m?m[1]:"";}

var STLABEL={nouveau:"Nouveau",rappel:"À rappeler",rdv:"RDV pris",non:"Pas intéressé",injoignable:"Injoignable"};
var STATUSES=[["rappel","À rappeler"],["rdv","RDV pris"],["non","Pas intéressé"],["injoignable","Injoignable"]];
var TABS=[["tous","Tous",""],["ouvert","Ont ouvert","dot-open"],["nouveau","Nouveaux",""],["rappel","À rappeler","dot-rappel"],["rdv","RDV pris","dot-rdv"],["non","Pas intéressé","dot-non"],["injoignable","Injoignable","dot-inj"]];
var IC={
  phone:'<svg viewBox="0 0 24 24"><path d="M5 3h3l2 5-2.5 1.5a11 11 0 005 5L14 12l5 2v3a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-3z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  undo:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v1"/></svg>'
};

function api(payload){
  payload.key=KEY;
  return fetch(FN,{method:"POST",headers:{"content-type":"application/json","apikey":ANON,"authorization":"Bearer "+ANON},body:JSON.stringify(payload)})
    .then(function(r){ if(r.status===401){throw {auth:true};} return r.json().then(function(j){ if(!r.ok) throw (j&&j.error)||("HTTP "+r.status); return j; }); });
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1600);}
function copy(txt,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(msg||"Copié");},function(){toast("Copie impossible");});} else toast("Copie non supportée"); }

function load(){
  document.getElementById("rows").innerHTML='<div class="state">Chargement…</div>';
  return api({action:"list",page:page,per:PER,filter:filter,q:query}).then(function(d){
    rows=d.rows||[]; counts=d.counts||{}; total=d.total||0; renderTable();
  }).catch(function(e){
    if(e&&e.auth){ showLogin("Mot de passe incorrect."); return; }
    document.getElementById("rows").innerHTML='<div class="state">Erreur : '+esc(String(e))+'</div>';
  });
}

function renderNav(){
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    var dot=t[2]?('<span class="dot '+t[2]+'"></span>'):'<span class="dot" style="background:transparent"></span>';
    var n=counts[t[0]]!=null?counts[t[0]]:"";
    return '<button class="navitem'+(filter===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+dot+'<span class="label">'+esc(t[1])+'</span><span class="cnt tnum">'+n+'</span></button>';
  }).join("");
  var opened=counts.ouvert||0;
  document.getElementById("foot").innerHTML=(counts.tous!=null?counts.tous+" hôtels ciblés<br>"+opened+" ont ouvert<br><br>":"")+'<a id="logout">Se déconnecter</a>';
}
function rateCell(r){ if(!r.overall_rating)return '<span class="rate" style="color:var(--ink-3)">—</span>'; return '<span class="rate tnum"><b>'+Number(r.overall_rating).toFixed(1)+'</b> · '+(r.reviews_count||0)+' avis</span>'; }

function renderTable(){
  renderNav();
  var pages=Math.max(1,Math.ceil(total/PER));
  document.getElementById("count").textContent=total+(total>1?" établissements":" établissement");
  var host=document.getElementById("rows");
  if(!rows.length){ host.innerHTML='<div class="state">Aucun établissement dans cette vue.</div>'; }
  else host.innerHTML=rows.map(function(r,i){
    var op=r.opens>0, stv=r.crm_status||"nouveau";
    var chip='<span class="chip" data-v="'+stv+'"><span class="cd"></span>'+esc(STLABEL[stv]||"Nouveau")+'</span>';
    var s=stars(r.hotel_class); var sub=esc((r.type||"hôtel")+(s?(" "+s+"★"):""))+" · "+esc(r.city||"")+" ("+esc(r.departement_code||"")+")";
    return '<div class="trow" data-idx="'+i+'">'+
      '<div class="cell-name"><div class="nm">'+(op?'<span class="odot" title="A ouvert le guidebook"></span>':'')+'<span>'+esc(r.hotel_name)+'</span></div><div class="sub2">'+sub+'</div></div>'+
      '<div class="cell-rate">'+rateCell(r)+'</div><div class="cell-status">'+chip+'</div></div>';
  }).join("");
  document.getElementById("pager").innerHTML= total>PER ?
    ('<span>Page '+page+' / '+pages+'</span><span class="pg"><button id="prev"'+(page<=1?' disabled':'')+'>Précédent</button><button id="next"'+(page>=pages?' disabled':'')+'>Suivant</button></span>') : '';
}

/* ---- Fiche plein écran ---- */
function openRecord(i){ openIdx=i; document.getElementById("overlay").classList.add("open"); renderRecord(); }
function closeRecord(){ openIdx=-1; document.getElementById("overlay").classList.remove("open"); }
function nextRecord(){
  if(openIdx<rows.length-1){ openIdx++; renderRecord(); }
  else if(page*PER<total){ page++; load().then(function(){ openIdx=0; renderRecord(); }); }
}
function prevRecord(){
  if(openIdx>0){ openIdx--; renderRecord(); }
  else if(page>1){ page--; load().then(function(){ openIdx=rows.length-1; renderRecord(); }); }
}
function globalPos(){ return (page-1)*PER + openIdx + 1; }

function renderRecord(){
  var r=rows[openIdx]; if(!r){ closeRecord(); return; }
  document.getElementById("recPos").textContent=globalPos()+" / "+total;
  document.getElementById("prevRec").disabled=(page<=1 && openIdx<=0);
  document.getElementById("nextRec").disabled=(page*PER>=total && openIdx>=rows.length-1);
  var stv=r.crm_status||"nouveau", op=r.opens>0, s=stars(r.hotel_class);
  var meta='<span>'+esc(r.type||"hôtel")+(s?(" · "+s+"★"):"")+'</span><span>·</span><span>'+esc(r.city||"")+" ("+esc(r.departement_code||"")+')</span>'+
    (r.overall_rating?('<span>·</span><span class="stars">'+Number(r.overall_rating).toFixed(1)+'★</span> <span class="tnum">('+(r.reviews_count||0)+' avis)</span>'):'');
  var openBadge=op?('<div class="rec-open"><span class="cd"></span>A ouvert le guidebook'+(r.last_open?(' le '+esc(r.last_open)):'')+' · '+r.opens+' fois</div>'):'';

  var contact=
    '<div class="field"><span class="flab">Téléphone</span><div class="fval"><span class="txt tnum">'+esc(r.phone_primary||"—")+'</span>'+(r.phone_primary?('<button class="icbtn" data-cptxt="'+esc(r.phone_primary)+'" title="Copier">'+IC.copy+'</button>'):'')+'</div></div>'+
    '<div class="field"><span class="flab">Email</span><div class="fval"><span class="txt">'+esc(r.email_primary||"—")+'</span>'+(r.email_primary?('<button class="icbtn" data-cptxt="'+esc(r.email_primary)+'" title="Copier">'+IC.copy+'</button>'):'')+'</div></div>'+
    (r.rate_per_night?('<div class="field"><span class="flab">Tarif indicatif / nuit</span><div class="fval"><span class="txt tnum">'+esc(r.rate_per_night)+' €</span></div></div>'):'')+
    (r.website_link?('<div class="field"><span class="flab">Site web</span><div class="fval"><a class="txt" href="'+esc(r.website_link)+'" target="_blank" rel="noopener">'+esc(r.website_link)+'</a></div></div>'):'');

  var actions='<div class="actions">'+
    '<a class="btn primary" href="'+tel(r.phone_primary)+'">'+IC.phone+'Appeler</a>'+
    '<a class="btn" href="mailto:'+esc(r.email_primary)+'">'+IC.mail+'Écrire</a>'+
    (r.guidebook_slug?('<a class="btn" href="'+gidUrl(r.guidebook_slug)+'" target="_blank" rel="noopener">'+IC.eye+'Aperçu guidebook</a>'):'')+
    '<a class="btn" href="'+mapsUrl(r)+'" target="_blank" rel="noopener">'+IC.pin+'Maps</a>'+
    '<button class="btn" data-copy="'+esc(r.id)+'">'+IC.copy+'Copier l\'email de relance</button>'+
  '</div>';

  var seg='<div class="seg">'+STATUSES.map(function(x){return '<button class="segbtn'+(stv===x[0]?' on':'')+'" data-set="'+esc(r.id)+'" data-v="'+x[0]+'">'+esc(x[1])+'</button>';}).join("")+'</div>';

  var undo = op ? ('<div><div class="sep"></div><button class="btn ghost-danger" data-reset="'+esc(r.id)+'">'+IC.undo+'Annuler l\'ouverture (erreur)</button><div class="flab" style="margin-top:6px;text-transform:none;letter-spacing:0;font-weight:450;color:var(--ink-3)">Si vous avez ouvert ce guidebook par erreur, remet ce prospect en « non ouvert ».</div></div>') : '';

  document.getElementById("recInner").innerHTML=
    '<div class="rec-title"><h2>'+esc(r.hotel_name)+'</h2><div class="rec-meta">'+meta+'</div>'+openBadge+'</div>'+
    actions+
    '<div class="grid2">'+contact+'</div>'+
    '<div><div class="flab" style="margin-bottom:8px">Statut de l\'appel</div>'+seg+'</div>'+
    '<div><div class="notes-h"><span class="flab">Notes d\'appel</span><span class="saved" data-saved="'+esc(r.id)+'">Enregistré</span></div>'+
      '<textarea class="notes" data-notes="'+esc(r.id)+'" placeholder="Ce qu\'ils ont dit, objections, quand rappeler…">'+esc(r.crm_notes||"")+'</textarea></div>'+
    (r.hotel_description?('<div class="field"><span class="flab">Description</span><p class="desc">'+esc(r.hotel_description)+'</p></div>'):'')+
    undo;
}

var FOLLOWUP=function(nom){return "Bonjour,\n\nSuite à notre échange, voici le livret d'accueil digital que j'avais préparé pour "+nom+" : https://guide.solvia.pro\n\nC'est une maquette personnalisée avec les infos de votre établissement. Vos clients y accèdent avec un simple lien avant d'arriver, et peuvent y réserver en un clic quelques petites attentions (champagne, late check-out, petit-déjeuner…).\n\nTout est modifiable au pixel près. Si ça vous parle, je serais ravi d'en discuter 15 minutes et de le mettre en place avec vous. Quand seriez-vous disponible ?\n\nBelle journée,\nQuentin";};

/* counts locaux après changement de statut */
function adjustCounts(oldSt,newSt){
  if(oldSt===newSt) return;
  if(counts[oldSt]!=null) counts[oldSt]=Math.max(0,counts[oldSt]-1);
  if(counts[newSt]!=null) counts[newSt]=(counts[newSt]||0)+1;
}
function setStatus(id,v){
  var r=rows.filter(function(x){return x.id===id;})[0]; if(!r)return;
  var old=r.crm_status||"nouveau", nv=(old===v)?"nouveau":v;
  adjustCounts(old,nv); r.crm_status=nv;
  renderTable(); if(openIdx>=0) renderRecord();
  api({action:"save",id:id,status:(nv==="nouveau"?null:nv),notes:r.crm_notes||""}).catch(function(e){ if(e&&e.auth)showLogin("Session expirée."); else toast("Erreur de sauvegarde"); });
}
var noteTimers={};
function saveNotes(id,val){
  var r=rows.filter(function(x){return x.id===id;})[0]; if(r)r.crm_notes=val;
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(function(){
    api({action:"save",id:id,status:(r&&r.crm_status&&r.crm_status!=="nouveau")?r.crm_status:null,notes:val}).then(function(){
      var s=document.querySelector('[data-saved="'+CSS.escape(id)+'"]'); if(s){s.style.opacity="1";clearTimeout(s._t);s._t=setTimeout(function(){s.style.opacity="0";},900);}
    },function(e){ if(e&&e.auth)showLogin("Session expirée."); else toast("Erreur de sauvegarde"); });
  },600);
}
function resetOpen(id){
  var r=rows.filter(function(x){return x.id===id;})[0]; if(!r)return;
  if(r.opens>0 && counts.ouvert!=null) counts.ouvert=Math.max(0,counts.ouvert-1);
  r.opens=0; r.last_open="";
  renderTable(); if(openIdx>=0) renderRecord(); toast("Ouverture annulée");
  api({action:"reset_open",id:id}).catch(function(e){ if(e&&e.auth)showLogin("Session expirée."); else toast("Erreur"); });
}

/* ---- événements ---- */
document.addEventListener("click",function(e){
  if(e.target.id==="logout"){ localStorage.removeItem(LSK); KEY=""; showLogin(""); return; }
  var nav=e.target.closest("[data-tab]"); if(nav){filter=nav.getAttribute("data-tab");page=1;closeRecord();load();return;}
  var set=e.target.closest("[data-set]"); if(set){setStatus(set.getAttribute("data-set"),set.getAttribute("data-v"));return;}
  var rst=e.target.closest("[data-reset]"); if(rst){resetOpen(rst.getAttribute("data-reset"));return;}
  var cp=e.target.closest("[data-copy]"); if(cp){var r=rows.filter(function(x){return x.id===cp.getAttribute("data-copy");})[0];copy(FOLLOWUP(r?r.hotel_name:"votre établissement"),"Email de relance copié");return;}
  var ct=e.target.closest("[data-cptxt]"); if(ct){copy(ct.getAttribute("data-cptxt"),"Copié");return;}
  if(e.target.id==="prev"){if(page>1){page--;closeRecord();load();}return;}
  if(e.target.id==="next"){page++;closeRecord();load();return;}
  if(e.target.closest("#nextRec")){nextRecord();return;}
  if(e.target.closest("#prevRec")){prevRecord();return;}
  if(e.target.closest("#closeRec")||e.target.id==="overlay"){closeRecord();return;}
  var row=e.target.closest("[data-idx]"); if(row){openRecord(parseInt(row.getAttribute("data-idx"),10));return;}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){query=e.target.value;page=1;clearTimeout(window._qt);window._qt=setTimeout(load,300);return;}
  var ta=e.target.closest("[data-notes]"); if(ta){saveNotes(ta.getAttribute("data-notes"),ta.value);}
});
document.addEventListener("keydown",function(e){
  if(openIdx<0) return;
  var t=e.target.tagName;
  if(t==="TEXTAREA"||t==="INPUT") return;   /* pas de navigation quand on écrit */
  if(e.key==="Escape") closeRecord();
  else if(e.key==="ArrowRight") nextRecord();
  else if(e.key==="ArrowLeft") prevRecord();
});

/* ---- login ---- */
function showLogin(msg){ closeRecord(); document.getElementById("app").style.display="none"; document.getElementById("login").style.display="flex"; document.getElementById("loginErr").textContent=msg||""; var p=document.getElementById("pass"); p.value=""; p.focus(); }
function enter(){
  var v=document.getElementById("pass").value.trim(); if(!v)return;
  KEY=v; localStorage.setItem(LSK,v);
  document.getElementById("loginErr").textContent="Vérification…";
  api({action:"ping"}).then(function(){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="grid"; load(); })
   .catch(function(e){ if(e&&e.auth){ localStorage.removeItem(LSK); KEY=""; showLogin("Mot de passe incorrect."); } else showLogin("Erreur réseau : "+esc(String(e))); });
}
document.getElementById("loginBtn").addEventListener("click",enter);
document.getElementById("pass").addEventListener("keydown",function(e){ if(e.key==="Enter")enter(); });

if(KEY){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="grid";
  api({action:"ping"}).then(function(){ load(); }).catch(function(e){ if(e&&e.auth){KEY="";localStorage.removeItem(LSK);showLogin("");} else { document.getElementById("app").style.display="grid"; load(); } });
} else { showLogin(""); }
</script>
