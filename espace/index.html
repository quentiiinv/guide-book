<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace hôtelier · SolvIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#2a2118; --ink-2:#6b6154; --ink-3:#9b9184;
  --cream:#faf8f5; --white:#fff; --line:#e8e2d9; --line-2:#d6cec2;
  --brand:#5b4a35; --brand-soft:#f2ede4;
  --ok:#2f7d5b; --ok-soft:#e7f2ec;
  --warn:#8a6524; --warn-soft:#faf1e0;
  --crit:#a3372f; --crit-soft:#fbeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--white);border-radius:18px;padding:32px 28px;width:100%;max-width:400px;
  box-shadow:0 10px 40px rgba(42,33,24,.08)}
.card h1{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.card .sub{color:var(--ink-2);font-size:14px;margin:0 0 22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--white);margin-bottom:14px}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 18px;
  font-weight:700;font-size:14px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn-2{background:var(--white);color:var(--ink);border:1px solid var(--line-2);
  border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;width:auto}
.msg{border-radius:9px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;line-height:1.5}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

header{background:var(--brand);color:#fff;padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header .nm{font-weight:800;font-size:16px}
header .sp{margin-left:auto;display:flex;gap:12px;align-items:center}
header a,header button.lnk{color:#fff;background:none;border:none;font-size:13px;
  font-weight:600;text-decoration:none;opacity:.85;padding:4px}
nav.tabs{background:var(--white);border-bottom:1px solid var(--line);
  display:flex;gap:2px;overflow-x:auto;padding:0 12px;position:sticky;top:53px;z-index:19}
/* Sur téléphone l'entête passe sur deux lignes : sa hauteur n'est plus celle
   sur laquelle le décalage ci-dessus est calculé. On le laisse défiler et
   c'est la barre d'onglets, seule, qui reste accessible. */
@media(max-width:560px){
  header{position:static}
  nav.tabs{top:0}
}
nav.tabs button{background:none;border:none;padding:13px 14px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:820px;margin:0 auto;padding:22px 18px 90px}
section h2{font-size:17px;font-weight:800;margin:0 0 3px}
section .hint{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.bloc{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.bloc h3{font-size:14px;font-weight:700;margin:0 0 14px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* modules */
.mod{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;margin-bottom:9px}
.mod .ic{font-size:22px;width:30px;text-align:center}
.mod .tx{flex:1;min-width:0}
.mod .tx b{display:block;font-size:14.5px;font-weight:700}
.mod .tx span{font-size:12.5px;color:var(--ink-3)}
.tgl{position:relative;width:46px;height:26px;flex:none}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.tgl i{position:absolute;inset:0;background:var(--line-2);border-radius:20px;transition:background .18s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl input:checked + i{background:var(--ok)}
.tgl input:checked + i::after{transform:translateX(20px)}
.tgl input:focus-visible + i{outline:2px solid var(--brand);outline-offset:2px}

/* horaires par jour */
.jr{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;margin-bottom:9px}
@media(max-width:560px){.jr{grid-template-columns:1fr}}
.jr .nm{font-size:13.5px;font-weight:600;color:var(--ink-2);padding-top:11px}
.jr select{margin-bottom:6px}
.hrs{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hrs span{font-size:12px;color:var(--ink-3);font-weight:600}
.hrs input{margin-bottom:0}

/* photos */
.pics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pic{position:relative;width:104px;height:78px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line-2);background:var(--brand-soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;padding:0}
.add-pic{width:104px;height:78px;border:1.5px dashed var(--line-2);border-radius:10px;
  background:none;color:var(--ink-3);font-size:12.5px;font-weight:600}

/* emoji */
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.emo button{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;
  background:var(--white);font-size:19px;padding:0}
.emo button.on{border-color:var(--brand);background:var(--brand-soft)}

/* commandes */
.cmd{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.cmd.nouvelle{border-left:4px solid var(--warn)}
.cmd-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cmd-ch{font-size:17px;font-weight:800}
.cmd-ref{font-size:11.5px;color:var(--ink-3);font-weight:600}
.cmd-tot{margin-left:auto;font-size:17px;font-weight:800}
.cmd-li{font-size:14px;color:var(--ink-2);padding:3px 0}
.cmd-ft{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tag.nouvelle{background:var(--warn-soft);color:var(--warn)}
.tag.vue,.tag.preparee{background:var(--brand-soft);color:var(--brand)}
.tag.servie{background:var(--ok-soft);color:var(--ok)}
.tag.annulee{background:var(--crit-soft);color:var(--crit)}
.vide{text-align:center;color:var(--ink-3);padding:40px 20px;font-size:14.5px}
.pastille{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  margin-left:7px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;
  font-size:11px;font-weight:800;font-style:normal;vertical-align:1px}
.todo{background:var(--warn-soft);border:1px solid #efdcb8;border-radius:14px;padding:15px 17px;margin-bottom:18px}
.todo b{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--warn);margin-bottom:9px}
.todo button{display:block;width:100%;text-align:left;background:none;border:none;padding:5px 0 5px 18px;
  position:relative;font-size:13.5px;line-height:1.5;color:var(--ink);text-decoration:underline;
  text-decoration-color:rgba(138,101,36,.35);text-underline-offset:3px}
.todo button::before{content:"→";position:absolute;left:0;color:var(--warn);font-weight:700;text-decoration:none}
.todo button:hover{text-decoration-color:var(--warn)}
.integ.off{opacity:.6}
.integ-h{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.integ-h b{font-size:14.5px;font-weight:700}
.etat{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap}
.etat.on{background:var(--ok-soft);color:var(--ok)}
.etat.off2{background:var(--warn-soft);color:var(--warn)}
.etat.vide2,.etat.attente{background:var(--brand-soft);color:var(--ink-3)}
.integ-d{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0 0 13px}
.integ-a{font-size:12.5px;color:var(--ink-3);line-height:1.55}
.integ-err{display:none;font-size:12.5px;color:var(--crit);background:var(--crit-soft);
  border-radius:8px;padding:8px 11px;margin:-4px 0 10px;line-height:1.5}

/* service des petits-déjeuners */
.jour-nav{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.jour-nav .btn-2{padding:9px 13px;font-size:15px;line-height:1}
.jour-t{flex:1;min-width:150px}
.jour-t b{display:block;font-size:16px;font-weight:800;text-transform:capitalize;letter-spacing:-.01em}
.jour-t input{margin:2px 0 0;padding:3px 0;border:none;background:none;
  font-size:12.5px;color:var(--ink-3);width:auto}
.jour-nav .imp{margin-left:auto}
.entete-imp{display:none}
.bilan{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.bilan>div{flex:1;min-width:82px;background:var(--white);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.bilan b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.bilan span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.bilan .reste{background:var(--warn-soft);border-color:#efdcb8}
.bilan .reste b{color:var(--warn)}
.creneau{margin-bottom:16px}
.creneau-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 7px;
  border-bottom:2px solid var(--line)}
.creneau-h b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.creneau-h span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.srv{display:flex;align-items:center;gap:13px;background:var(--white);
  border:1px solid var(--line);border-top:none;padding:13px 15px}
.srv:first-of-type{border-top:1px solid var(--line);margin-top:9px;
  border-radius:12px 12px 0 0}
.srv:last-child{border-radius:0 0 12px 12px}
.srv.fait{background:var(--ok-soft);border-color:#cfe6da}
.srv.fait .srv-ch,.srv.fait .srv-tx b{opacity:.5;text-decoration:line-through}
.srv-ch{flex:none;min-width:46px;height:46px;border-radius:11px;background:var(--brand-soft);
  color:var(--brand);display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;padding:0 8px}
.srv-tx{flex:1;min-width:0}
.srv-tx b{display:block;font-size:14.5px;font-weight:700}
.srv-tx span{font-size:12.5px;color:var(--ink-3)}
.srv-pay{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.srv-pay.ok{background:var(--ok-soft);color:var(--ok)}
.srv-pay.du{background:var(--warn-soft);color:var(--warn)}
/* chambres et QR */
.qrs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.qr-c{width:104px;text-align:center;border:1px solid var(--line);border-radius:12px;
  padding:9px 6px;background:var(--white)}
.qr-c img{width:88px;height:88px;display:block;margin:0 auto 5px;image-rendering:pixelated}
.qr-c b{display:block;font-size:15px;font-weight:800}
.qr-c .qr-code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.qr-c .rm{font-size:11px;padding:2px}
.ch-add{display:flex;gap:9px;align-items:center}
.ch-add input{margin-bottom:0}
.ch-add .btn-2{flex:none}
.arr{display:flex;align-items:center;gap:13px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:9px}
.arr-qr{flex:none;width:52px;height:52px;border-radius:8px;border:1px solid var(--line);
  image-rendering:pixelated;background:#fff}
.arr .btn-2{flex:none}
.apercu{background:var(--brand-soft);border-radius:12px;padding:14px 16px;margin-top:12px}
.apercu>b{display:block;font-size:14px;margin-bottom:9px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.col-ok{font-size:11px;font-weight:600;background:var(--ok-soft);color:var(--ok);
  padding:3px 8px;border-radius:20px}
.apercu-l{font-size:13px;color:var(--ink-2);padding:2px 0}
.apercu .btn-2{margin-top:11px}
#a-coller{min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
@media(max-width:560px){ .arr{flex-wrap:wrap} .arr .btn-2,.arr .rm{flex:1} }
.srv.doute{border-left:4px solid var(--crit)}
.srv-ch.ch-doute{background:var(--crit-soft);color:var(--crit)}
.srv-pay.doute-b{background:var(--crit-soft);color:var(--crit);cursor:help}
.tag.doute-t{background:var(--crit-soft);color:var(--crit)}
.bilan .alerte{background:var(--crit-soft);border-color:#f0cdca}
.bilan .alerte b{color:var(--crit)}
.srv-mix{flex:none;font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.srv-b{flex:none;background:var(--white);border:1px solid var(--line-2);border-radius:9px;
  padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.srv.fait .srv-b{background:none;border-color:transparent;color:var(--ok);font-weight:700}
@media(max-width:560px){
  .srv{flex-wrap:wrap}
  .srv-b{width:100%;margin-top:4px}
}

/* Feuille de service : ce qui part à l'imprimante pour la cuisine. */
@media print{
  header,nav.tabs,.jour-nav,.todo,.srv-b{display:none!important}
  /* Impression des QR : la page ne montre plus que les codes des chambres. */
  body.imp-qr .bloc,body.imp-qr section>h2,body.imp-qr section>.hint,
  body.imp-qr .ch-add,body.imp-qr .integ-a,body.imp-qr .qr-c .rm{display:none!important}
  body.imp-qr .bloc:has(.qrs){display:block!important}
  body.imp-qr .qrs{display:flex;flex-wrap:wrap;gap:16px}
  body.imp-qr .qr-c{width:150px;border:1px solid #000;padding:12px 8px;
    break-inside:avoid;page-break-inside:avoid}
  body.imp-qr .qr-c img{width:126px;height:126px}
  body.imp-qr .qr-c b{font-size:17pt}
  body{background:#fff;font-size:12pt}
  main{max-width:none;padding:0}
  .entete-imp{display:block;font-size:14pt;margin-bottom:14px;
    padding-bottom:8px;border-bottom:2px solid #000}
  .entete-imp b{font-weight:800}
  .bilan>div{border:1px solid #000;padding:6px 10px}
  .bilan b{font-size:16pt}
  .creneau{break-inside:avoid;page-break-inside:avoid}
  .srv{border:1px solid #000;border-top:none;padding:8px 10px}
  .srv.fait{background:none}
  .srv-ch{background:none;border:1.5px solid #000;color:#000}
  /* case à cocher, pour pointer au stylo */
  .srv::after{content:"";flex:none;width:17px;height:17px;border:1.5px solid #000;border-radius:3px}
  .srv.fait::after{content:"✓";display:flex;align-items:center;justify-content:center;font-weight:800}
}
.cle{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;letter-spacing:.08em;
  background:var(--brand-soft);border-radius:9px;padding:10px 13px;margin-bottom:11px;color:var(--ink-2)}
.zone{margin-top:11px}
.zone input{margin-bottom:9px}

.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--white)}
.item-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.item-h .em{font-size:22px}
.item-h .nm{font-weight:700;flex:1}
.rm{background:none;border:none;color:var(--crit);font-size:12.5px;font-weight:600;padding:4px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);
  font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0}
.sw input{width:auto;margin:0}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Espace hôtelier</h1>
    <p class="sub">Connectez-vous avec les identifiants que SolvIA vous a transmis.</p>
    <div id="lg-msg"></div>
    <label for="lg-mail">Adresse email</label>
    <input id="lg-mail" type="email" placeholder="vous@votre-hotel.fr" autocomplete="username">
    <label for="lg-mdp">Mot de passe</label>
    <input id="lg-mdp" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="lg-go">Se connecter</button>
    <button id="lg-oubli" style="width:100%;margin-top:10px;background:none;border:none;color:var(--ink-3);font-size:13px;font-weight:600;padding:8px">Mot de passe oublié</button>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <span class="nm" id="hd-nom">…</span>
    <span class="sp">
      <a id="hd-livret" href="#" target="_blank" rel="noopener">Voir mon livret</a>
      <button class="lnk" id="hd-out">Déconnexion</button>
    </span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="vue"></main>
</div>

<script src="qr.js"></script>
<script>
var SUPA='https://nocifyylfyafbfppmykp.supabase.co';
var KEY='sb_publishable_OKNvEE9qH7CMfjMXBmItNA_gSed6gjJ';
var JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
var MODES=[['ferme','Fermé'],['midi','Le midi'],['soir','Le soir'],
           ['midi_soir','Midi et soir'],['journee','Toute la journée'],['precis','Horaires précis']];
var EMOJIS=['🍾','🥂','🍷','🍺','🧺','💐','🌹','🍫','🎂','🍓','☕','🥐','🛏️','🕐','🕒','🧖','🚲','🚗','🎁','🕯️','🧴','👶','🐾','🍽️'];
var EMOJIS_LIEUX=['🍽️','🍷','🍺','☕','🥐','🏰','⛪','🖼️','🌳','🌊','🏖️','⛰️','🚶','🚲','🛶','🎣','🛍️','🎭','🎡','🐴'];
/* Les modules du livret, dans l'ordre ou l'hotelier les rencontre. */
var MODULES=[
  {c:'a_petit_dej',  ic:'🥐', nom:'Petit-déjeuner',     desc:'Prix, horaires et contenu',        onglet:'pdj'},
  {c:'a_restaurant', ic:'🍽️', nom:'Restaurant',         desc:'Horaires, carte, réservation',     onglet:'resto'},
  {c:'a_extras',     ic:'✨', nom:'Petites attentions', desc:'Ce que vos clients commandent',    onglet:'extras'},
  {c:'a_late_checkout', ic:'🕐', nom:'Départ tardif',   desc:'Heure et supplément',              onglet:'lco'},
  {c:'a_piscine',    ic:'🏊', nom:'Piscine',            desc:'Horaires et accès',                onglet:'piscine'},
  {c:'a_spa',        ic:'🧖', nom:'Spa',                desc:'Horaires et accès',                onglet:'spa'},
  {c:'a_sauna',      ic:'🔥', nom:'Sauna',              desc:'Horaires et accès',                onglet:'sauna'},
  {c:'a_recos',      ic:'📍', nom:'Recommandations',    desc:'Vos bonnes adresses',              onglet:'recos'},
  {c:'a_avis',       ic:'⭐', nom:'Avis',               desc:'Inviter à laisser un avis'},
  {c:'a_infos',      ic:'ℹ️', nom:'Infos pratiques',    desc:'Parking, wifi, animaux…',          onglet:'infos'}
];
/* Icones des infos pratiques : ce sont des cles, pas des emojis. Le livret
   les convertit en pictogrammes (lhInfoIcon), la liste doit donc rester
   alignee sur la sienne. */

var TOK=null, HOTEL=null, EXTRAS=[], RECOS=[], INFOS=[], CATALOGUE=[], BRANCHE={}, SECRETS={},

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(id){return document.getElementById(id);}
function msg(box,txt,type){var e=el(box); if(e) e.innerHTML=txt?'<div class="msg '+type+'">'+esc(txt)+'</div>':'';}

function api(chemin,opt){
  opt=opt||{};
  var h={'apikey':KEY};
  if(!opt.raw) h['content-type']='application/json';
  if(TOK) h['authorization']='Bearer '+TOK;
  if(opt.prefer) h['prefer']=opt.prefer;
  if(opt.type) h['content-type']=opt.type;
  return fetch(SUPA+chemin,{method:opt.method||'GET',headers:h,
    body:opt.raw?opt.raw:(opt.body?JSON.stringify(opt.body):undefined)})
    .then(function(r){ return r.text().then(function(t){
      var d=null; try{d=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){ var er=new Error((d&&(d.message||d.error_description||d.error))||'Erreur '+r.status);
        er.status=r.status; throw er; }
      return d; }); });
}

function demarrer(){
  TOK=TOK||localStorage.getItem('solvia_tok');
  if(!TOK) return;
  api('/rest/v1/hotels?select=*&limit=1').then(function(rows){
    if(!rows||!rows.length){
      msg('lg-msg','Ce compte n\'est rattaché à aucun établissement.','err');
      localStorage.removeItem('solvia_tok'); TOK=null; return; }

    el('hd-livret').href='https://guide.solvia.pro/?slug='+encodeURIComponent(HOTEL.slug);

       qu'elles soient la avant de dessiner. */
    Promise.all([chargerExtras(),chargerRecos(),chargerInfos(),chargerIntegrations(),chargerEquipements(),chargerChambres()])
      .then(function(){ if(!ONGLET) ONGLET = HOTEL.a_petit_dej ? 'service' : 'cmd';
        rendreOnglets(); rendre(); suivre(); });

}

/* Adresse courte : le code ne revele ni l'hotel ni la chambre, et surtout il
   n'y a plus rien a modifier dans la barre d'adresse. */
function lienCode(code){ return 'https://guide.solvia.pro/'+encodeURIComponent(code||''); }
function lienSejour(r){ return lienCode(r.token); }
function lienChambre(c){ return lienCode(c && c.code); }
function qrData(texte,taille){
  try{ var q=qrcode(0,'M'); q.addData(texte); q.make(); return q.createDataURL(taille||4,2); }

}

/* --- reconnaissance des colonnes d'un export ---
   Chaque logiciel nomme ses colonnes autrement. On cherche des mots, pas une
   position, pour que l'hôtelier n'ait rien à réorganiser. */
var COLONNES=[
  ['chambre_n',          /(chambre|room|n°|numero|numéro|unit)/i],
  ['prenom',             /(pr[ée]nom|first ?name|given)/i],
  ['nom',                /(^nom|last ?name|surname|family|client|guest|invit)/i],
  ['email',              /(e-?mail|courriel)/i],
  ['telephone',          /(t[ée]l|phone|mobile|portable)/i],
  ['date_arrivee',       /(arriv|check.?in|d[ée]but|from|entr[ée]e)/i],
  ['date_depart',        /(d[ée]part|check.?out|fin|to|sortie)/i],
  ['pdj_restant_adulte', /(pdj|petit|breakfast|d[ée]jeuner)/i],
  ['pdj_restant_enfant', /(enfant|child|kid)/i],
  ['langue',             /(langue|lang|language)/i]
];
function separateur(l){
  var c={};[';','\t',','].forEach(function(s){ c[s]=l.split(s).length; });
  return [';','\t',','].sort(function(a,b){ return c[b]-c[a]; })[0];
}
function cellules(l,sep){
  /* guillemets respectés : un nom peut contenir le séparateur */
  var out=[],cur='',guill=false;
  for(var i=0;i<l.length;i++){
    var ch=l[i];
    if(ch==='"'){ if(guill&&l[i+1]==='"'){cur+='"';i++;} else guill=!guill; }
    else if(ch===sep && !guill){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(function(x){ return x.trim(); });
}
function versDate(v){
  v=String(v||'').trim(); if(!v) return null;
  var m=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);   /* jour/mois/année */
  if(m){ var an=m[3].length===2?'20'+m[3]:m[3];
    return an+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2); }
  return null;
}
function lireImport(texte){
  var lignes=String(texte||'').split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(lignes.length<2) return null;
  var sep=separateur(lignes[0]);
  var entetes=cellules(lignes[0],sep);
  var plan={};
  entetes.forEach(function(h,i){
    for(var k=0;k<COLONNES.length;k++){
      if(COLONNES[k][1].test(h) && plan[COLONNES[k][0]]===undefined){ plan[COLONNES[k][0]]=i; return; }
    }
  });
  if(plan.chambre_n===undefined) return {erreur:'Aucune colonne « chambre » reconnue.'};
  var out=[];
  for(var n=1;n<lignes.length;n++){
    var c=cellules(lignes[n],sep);
    var o={hotel_id:HOTEL.id, statut:'confirmee'};
    Object.keys(plan).forEach(function(champ){
      var v=(c[plan[champ]]||'').trim(); if(!v) return;
      if(champ.indexOf('date_')===0) { var d=versDate(v); if(d) o[champ]=d; }
      else if(champ.indexOf('pdj_')===0) o[champ]=parseInt(v,10)||0;
      else o[champ]=v;
    });
    if(o.chambre_n) out.push(o);
  }
  return {plan:plan, entetes:entetes, lignes:out};
}
function apercuImport(texte){
  var z=el('a-apercu'); if(!z) return;
  IMPORT=lireImport(texte);
  if(!IMPORT){ z.innerHTML=''; return; }
  if(IMPORT.erreur){
    z.innerHTML='<div class="integ-err" style="display:block">'+esc(IMPORT.erreur)
      +' Attendu : une première ligne de titres, dont un contenant « chambre ».</div>'; return; }
  var reconnues=Object.keys(IMPORT.plan).map(function(k){
    return '<span class="col-ok">'+esc(IMPORT.entetes[IMPORT.plan[k]])+' → '+esc(k)+'</span>'; }).join('');
  z.innerHTML='<div class="apercu"><b>'+IMPORT.lignes.length+' arrivée'
    +(IMPORT.lignes.length>1?'s':'')+' lue'+(IMPORT.lignes.length>1?'s':'')+'</b>'
    +'<div class="cols">'+reconnues+'</div>'
    +IMPORT.lignes.slice(0,5).map(function(o){
      return '<div class="apercu-l">'+esc(o.chambre_n)+' · '
        +esc([o.prenom,o.nom].filter(Boolean).join(' ')||'—')
        +(o.date_arrivee?' · '+esc(o.date_arrivee):'')
        +' · '+((o.pdj_restant_adulte||0)+(o.pdj_restant_enfant||0))+' pdj compris</div>'; }).join('')
    +(IMPORT.lignes.length>5?'<div class="apercu-l">…</div>':'')
    +'<button class="btn-2" id="a-importer">Importer ces '+IMPORT.lignes.length+' arrivées</button></div>';
  var b=el('a-importer');
  if(b) b.onclick=function(){
    b.disabled=true; b.textContent='Import…';
    var l=IMPORT.lignes.map(function(o){
      o.pdj_inclus_adulte=o.pdj_restant_adulte||0;
      o.pdj_inclus_enfant=o.pdj_restant_enfant||0;
      if(!o.date_arrivee) o.date_arrivee=JOURA;
      return o; });
    ajouterSejours(l).then(function(){
      el('a-coller').value=''; z.innerHTML='';
    }).catch(function(){ b.disabled=false; b.textContent='Réessayer'; });
  };
}

/* --- service des petits-déjeuners ---
   L'écran de tous les matins : ce que la cuisine doit sortir, à quelle heure
   et pour quelle chambre. Une journée à la fois. */
function jourISO(d){ return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jourDefaut(){
  var d=new Date();
  /* Après 14h on prépare le lendemain : c'est là que la cuisine s'organise. */
  if(d.getHours()>=14) d.setDate(d.getDate()+1);
  return jourISO(d);
}
function jourLisible(iso){
  var d=new Date(iso+'T00:00:00'), a=jourISO(new Date());
  var dem=new Date(); dem.setDate(dem.getDate()+1);
  var prefixe = iso===a ? 'Aujourd\'hui · ' : (iso===jourISO(dem) ? 'Demain · ' : '');
  return prefixe+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function decaler(n){
  var d=new Date((JOUR||jourDefaut())+'T00:00:00');
  d.setDate(d.getDate()+n); JOUR=jourISO(d); rendre();
}
function vueService(){
  JOUR=JOUR||jourDefaut();
  return '<section><div class="jour-nav">'
    +'<button class="btn-2" id="j-prec" aria-label="Jour précédent">‹</button>'
    +'<div class="jour-t"><b>'+esc(jourLisible(JOUR))+'</b>'
    +'<input type="date" id="j-date" value="'+esc(JOUR)+'"></div>'
    +'<button class="btn-2" id="j-suiv" aria-label="Jour suivant">›</button>'
    +'<button class="btn-2 imp" id="j-imp">Imprimer</button></div>'
    +'<div class="entete-imp"><b>'+esc(HOTEL.nom||'')+'</b> · '+esc(jourLisible(JOUR))+'</div>'
    +'<div id="serv"><div class="vide">Chargement…</div></div></section>';
}
function chargerService(){
  var j=JOUR||jourDefaut();
  return api('/rest/v1/service_pdj?select=*&date_service=eq.'+j)
    .then(function(l){ SERVICE=l||[]; if(ONGLET==='service'){ rendreService(); brancherService(); } })
    .catch(function(e){ var h=el('serv');
      if(h) h.innerHTML='<div class="vide">'+esc(e.message)+'</div>'; });
}
/* Le compteur de l'onglet ne regarde que le service en cours de préparation. */
function compterAPreparer(){
  return api('/rest/v1/service_pdj?select=nb_adulte,nb_enfant&date_service=eq.'
      +jourDefaut()+'&statut=eq.a_preparer')
    .then(function(l){ A_PREPARER=(l||[]).reduce(function(s,x){
      return s+(x.nb_adulte||0)+(x.nb_enfant||0); },0); rendreOnglets(); })
    .catch(function(){});
}
function normHeure(s){ return String(s||'').replace('h',':').padStart(5,'0'); }
function rendreService(){
  var h=el('serv'); if(!h) return;
  var vivantes=SERVICE.filter(function(x){ return x.statut!=='annule'; });
  if(!vivantes.length){
    h.innerHTML='<div class="vide">Aucun petit-déjeuner ce jour-là.<br>'
      +'Les réservations apparaissent ici dès qu\'un client en passe une.</div>'; return; }

  var ad=0,en=0,ca=0,reste=0,compris=0,doutes=0;
  vivantes.forEach(function(x){ ad+=x.nb_adulte||0; en+=x.nb_enfant||0;
    ca+=Number(x.total||0); compris+=(x.nb_adulte_prepaye||0)+(x.nb_enfant_prepaye||0);
    if(x.chambre_verifiee===false) doutes++;
    if(x.statut==='a_preparer') reste+=(x.nb_adulte||0)+(x.nb_enfant||0); });

  /* Regroupement par heure : c'est l'unité de travail en cuisine. */
  var parHeure={}, heures=[];
  vivantes.forEach(function(x){
    if(!parHeure[x.heure]){ parHeure[x.heure]=[]; heures.push(x.heure); }
    parHeure[x.heure].push(x); });
  heures.sort(function(a,b){ return normHeure(a).localeCompare(normHeure(b)); });

  h.innerHTML='<div class="bilan">'
    +'<div><b>'+(ad+en)+'</b><span>couvert'+(ad+en>1?'s':'')+'</span></div>'
    +'<div><b>'+ad+'</b><span>adulte'+(ad>1?'s':'')+'</span></div>'
    +'<div><b>'+en+'</b><span>enfant'+(en>1?'s':'')+'</span></div>'
    +(compris?'<div><b>'+compris+'</b><span>compris dans le séjour</span></div>':'')
    +'<div><b>'+Math.round(ca)+' €</b><span>à encaisser</span></div>'
    +(reste?'<div class="reste"><b>'+reste+'</b><span>à servir</span></div>':'')
    +(doutes?'<div class="alerte"><b>'+doutes+'</b><span>chambre'+(doutes>1?'s':'')
      +' à confirmer</span></div>':'')
    +'</div>'
    +heures.map(function(hh){
      var g=parHeure[hh], p=g.reduce(function(s,x){return s+(x.nb_adulte||0)+(x.nb_enfant||0);},0);
      g.sort(function(a,b){ return String(a.chambre||'').localeCompare(String(b.chambre||''),'fr',{numeric:true}); });
      return '<div class="creneau"><div class="creneau-h"><b>'+esc(hh)+'</b>'
        +'<span>'+p+' couvert'+(p>1?'s':'')+'</span></div>'
        +g.map(ligneService).join('')+'</div>';
    }).join('');
  h.querySelectorAll('[data-servi]').forEach(function(b){
    b.onclick=function(){
      var neuf = b.dataset.etat==='servi' ? 'a_preparer' : 'servi';
      b.disabled=true;
      api('/rest/v1/commande_lignes?id=eq.'+b.dataset.servi,{method:'PATCH',body:{statut:neuf}})
        .then(function(){ return chargerService(); }).then(compterAPreparer)
        .catch(function(e){ alert(e.message); b.disabled=false; });
    };
  });
}
function ligneService(x){
  var servi=x.statut==='servi';
  var pax=(x.nb_adulte||0)+' adulte'+((x.nb_adulte||0)>1?'s':'')
    +((x.nb_enfant||0)?' · '+x.nb_enfant+' enfant'+(x.nb_enfant>1?'s':''):'');
  var compris=(x.nb_adulte_prepaye||0)+(x.nb_enfant_prepaye||0);
  var du=Number(x.total||0);
  var doute = x.chambre_verifiee===false;
  return '<div class="srv'+(servi?' fait':'')+(doute?' doute':'')+'">'
    +'<span class="srv-ch'+(doute?' ch-doute':'')+'">'+esc(x.chambre||'?')+'</span>'
    +'<span class="srv-tx"><b>'+esc(pax)+'</b>'
    +'<span>'+esc([x.prenom,x.nom].filter(Boolean).join(' ')||x.reference)
    +(x.langue&&x.langue!=='fr'?' · '+esc(String(x.langue).toUpperCase()):'')
    +(x.note?' · '+esc(x.note):'')+'</span></span>'
    +'<span class="srv-pay '+(x.paye||!du?'ok':'du')+'">'
    +(du===0 ? (compris?'compris':'offert')
             : (x.paye?'réglé':Math.round(du)+' €'))+'</span>'
    +(compris&&du>0?'<span class="srv-mix">dont '+compris+' compris</span>':'')
    +(doute?'<span class="srv-pay doute-b" title="Cette chambre n\'est pas occupée aujourd\'hui '
      +'selon vos arrivées. Vérifiez avant de servir.">chambre à confirmer</span>':'')
    +'<button class="srv-b" data-servi="'+x.id+'" data-etat="'+esc(x.statut)+'">'
    +(servi?'Servi ✓':'Marquer servi')+'</button></div>';
}
function brancherService(){
  var v=el('vue'); if(!v.querySelector('#j-date')) return;
  v.querySelector('#j-prec').onclick=function(){ decaler(-1); };
  v.querySelector('#j-suiv').onclick=function(){ decaler(1); };
  v.querySelector('#j-date').onchange=function(){ JOUR=this.value||jourDefaut(); rendre(); };
  v.querySelector('#j-imp').onclick=function(){ window.print(); };
}

/* --- piscine, spa, sauna ---
   Une ligne par équipement dans hotel_facilities. Le catalogue partagé
   (hotel_id nul) sert de modèle ; à la première modification, l'hôtel se
   crée la sienne. */
function chargerEquipements(){
  return api('/rest/v1/hotel_facilities?select=*&hotel_id=eq.'+HOTEL.id)
    .then(function(l){ EQUIPEMENTS={}; (l||[]).forEach(function(x){ EQUIPEMENTS[x.type]=x; }); });
}
function vueEquipement(type){
  var e=EQUIPEMENTS[type]||{}, d=EQUIPS[type];
  return '<section><h2>'+d[0]+' '+esc(d[1])+'</h2>'
    +'<p class="hint">Ce que vos clients liront avant de s\'y rendre. '
    +'Laissez vide ce qui ne s\'applique pas.</p>'
    +'<div class="bloc" data-eq="'+type+'"><div class="grid2">'
    +'<div><label>Nom affiché</label><input data-e="titre" type="text" placeholder="'+esc(d[1])
    +'" value="'+esc(e.titre||'')+'"></div>'
    +'<div><label>Horaires</label><input data-e="horaires" type="text" '
    +'placeholder="7h – 21h" value="'+esc(e.horaires||'')+'"></div>'
    +'</div>'
    +'<label>Description</label><textarea data-e="description">'+esc(e.description||'')+'</textarea>'
    +'<div class="grid2">'
    +'<div><label>Accès</label><input data-e="acces" type="text" '
    +'placeholder="Au sous-sol, badge à la réception" value="'+esc(e.acces||'')+'"></div>'
    +'<div><label>À prévoir</label><input data-e="a_prevoir" type="text" '
    +'placeholder="Serviette fournie, bonnet obligatoire" value="'+esc(e.a_prevoir||'')+'"></div>'
    +'</div>'
    +'<label>Icône</label><div class="emo">'+EMOJIS.map(function(x){
      return '<button type="button" data-emo="'+x+'"'+((e.emoji||d[0])===x?' class="on"':'')+'>'+x+'</button>';
    }).join('')+'</div></div>'
    +'<div class="bloc"><h3>Photo</h3><div class="pics" data-eqpic="'+type+'">'
    +(e.photo_url?'<div class="pic"><img src="'+esc(e.photo_url)+'" alt="">'
      +'<button data-eqdel aria-label="Supprimer">×</button></div>':'')
    +'<button class="add-pic" data-eqadd>+ Ajouter</button></div>'
    +'<div style="font-size:12.5px;color:var(--ink-3)">Format paysage conseillé. '
    +'L\'image est réduite automatiquement.</div></div></section>';
}
function brancherEquipement(type){
  var b=el('vue').querySelector('[data-eq="'+type+'"]');
  /* Crée la ligne de l'hôtel si elle n'existe pas encore, puis la modifie. */
  function ecrire(champ,valeur,input){
    var e=EQUIPEMENTS[type];
    var suite = e
      ? api('/rest/v1/hotel_facilities?id=eq.'+e.id,{method:'PATCH',
          body:(function(o){o[champ]=valeur;return o;})({}),prefer:'return=representation'})
      : api('/rest/v1/hotel_facilities',{method:'POST',prefer:'return=representation',
          body:(function(o){o.hotel_id=HOTEL.id;o.type=type;o.titre=EQUIPS[type][1];
                o.emoji=EQUIPS[type][0];o[champ]=valeur;return o;})({})});
    return suite.then(function(rows){ if(rows&&rows[0]) EQUIPEMENTS[type]=rows[0]; flash(input,true); })
      .catch(function(err){ flash(input,false); alert(err.message); });
  }
  b.querySelectorAll('[data-e]').forEach(function(i){
    i.onchange=function(){ ecrire(i.dataset.e, i.value.trim()||null, i); };
  });
  b.querySelectorAll('[data-emo]').forEach(function(t){
    t.onclick=function(){
      b.querySelectorAll('[data-emo]').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on'); ecrire('emoji',t.dataset.emo,null);
    };
  });
  var zone=el('vue').querySelector('[data-eqpic="'+type+'"]');
  var sup=zone.querySelector('[data-eqdel]');
  if(sup) sup.onclick=function(){ ecrire('photo_url',null,null).then(rendre); };
  zone.querySelector('[data-eqadd]').onclick=function(){
    var f=document.createElement('input'); f.type='file'; f.accept='image/*';
    f.onchange=function(){
      if(!f.files||!f.files[0]) return;
      reduire(f.files[0]).then(function(blob){
        var nom=HOTEL.id+'/'+type+'-'+Date.now()+'.jpg';
        return api('/storage/v1/object/equipements/'+nom,{method:'POST',raw:blob,type:'image/jpeg'})
          .then(function(){ return ecrire('photo_url',
            SUPA+'/storage/v1/object/public/equipements/'+nom, null); })
          .then(rendre);
      }).catch(function(err){ alert('Envoi impossible : '+err.message); });
    };
    f.click();
  };
}

/* --- integrations ---
   L'ecran est dessine depuis la table integrations : en ajouter une plus tard
   ne demande qu'une ligne en base, pas une nouvelle version de cette page. */
function chargerIntegrations(){
  return Promise.all([
    api('/rest/v1/integrations?select=*&order=ordre'),
    api('/rest/v1/hotel_integrations?select=*&hotel_id=eq.'+HOTEL.id),
    api('/rest/v1/rpc/etat_secrets',{method:'POST',body:{}})
  ]).then(function(r){
    CATALOGUE=r[0]||[]; BRANCHE={}; SECRETS=r[2]||{};
    (r[1]||[]).forEach(function(x){ BRANCHE[x.code]=x; });
  });
}
function vueIntegrations(){
  var dispo=CATALOGUE.filter(function(i){return i.disponible;});
  var plus =CATALOGUE.filter(function(i){return !i.disponible;});
  return '<section><h2>Intégrations</h2>'
    +'<p class="hint">Branchez vos outils. Rien n\'est obligatoire : ce que vous laissez vide '
    +'reste simplement inactif dans le livret.</p>'
    +dispo.map(carteInteg).join('')
    +(plus.length?'<h3 style="font-size:13px;font-weight:700;margin:26px 0 10px;color:var(--ink-3);'
      +'letter-spacing:.04em;text-transform:uppercase">Bientôt</h3>'+plus.map(carteInteg).join(''):'')
    +'</section>';
}
function carteInteg(i){
  if(i.gabarit==='secret') return carteSecret(i);
  var v=BRANCHE[i.code]||{}, rempli=!!v.valeur, off=!i.disponible;
  return '<div class="bloc integ'+(off?' off':'')+'" data-i="'+esc(i.code)+'">'
    +'<div class="integ-h"><b>'+esc(i.nom)+'</b>'
    +(off?'<span class="etat attente">Bientôt</span>'
        :(rempli&&v.actif!==false?'<span class="etat on">Actif</span>'
        :(rempli?'<span class="etat off2">En pause</span>':'<span class="etat vide2">Non branché</span>')))
    +'</div>'
    +'<p class="integ-d">'+esc(i.description||'')+'</p>'
    +(off?'':'<input data-v type="'+(i.gabarit==='email'?'email':'text')+'" '
      +'placeholder="'+esc(i.exemple||'')+'" value="'+esc(v.valeur||'')+'">'
      +'<div class="integ-err"></div>'
      +(i.aide?'<div class="integ-a">'+esc(i.aide)+'</div>':'')
      +(rempli?'<label class="sw" style="margin-top:10px"><input type="checkbox" data-on'
        +(v.actif!==false?' checked':'')+'> Activé</label>':''))
    +(i.publique===false&&!off?'<div class="integ-a" style="margin-top:8px">'
      +'🔒 Cette information reste entre vous et nous, elle n\'apparaît jamais dans le livret.</div>':'')
    +'</div>';
}
/* Une clé se dépose, elle ne se relit pas : on n'affiche que ses 4 derniers
   caractères, renvoyés par le serveur. */
function carteSecret(i){
  var s=SECRETS[i.code];
  return '<div class="bloc integ" data-s="'+esc(i.code)+'">'
    +'<div class="integ-h"><b>'+esc(i.nom)+'</b>'
    +(s?'<span class="etat on">Actif</span>':'<span class="etat vide2">Non branché</span>')+'</div>'
    +'<p class="integ-d">'+esc(i.description||'')+'</p>'
    +(s?'<div class="cle">•••••••••••••'+esc(s.indice||'')+'</div>'
        +'<div class="integ-err"></div>'
        +'<button class="btn-2" data-remplacer>Remplacer</button> '
        +'<button class="btn-2" data-retirer>Retirer</button>'
        +'<div class="zone hide"><input data-secret type="password" autocomplete="off" '
        +'placeholder="'+esc(i.exemple||'')+'"><button class="btn-2" data-valider>Enregistrer</button></div>'
      :'<input data-secret type="password" autocomplete="off" placeholder="'+esc(i.exemple||'')+'">'
       +'<div class="integ-err"></div>')
    +(i.aide?'<div class="integ-a">'+esc(i.aide)+'</div>':'')
    +'<div class="integ-a" style="margin-top:8px">🔒 Déposée chiffrée. Ni le livret, ni cet écran, '
    +'ni nous ne pouvons la relire ensuite : seul le serveur qui parle à Stripe y accède.</div>'
    +'</div>';
}
function brancherSecrets(){
  el('vue').querySelectorAll('[data-s]').forEach(function(b){
    var code=b.dataset.s, err=b.querySelector('.integ-err');
    function deposer(valeur,input){
      if(err){ err.textContent=''; err.style.display='none'; }
      return api('/rest/v1/rpc/enregistrer_secret',{method:'POST',body:{p_code:code,p_valeur:valeur}})
        .then(function(){ return chargerIntegrations(); }).then(rendre)
        .catch(function(e){ flash(input,false);
          if(err){ err.textContent=e.message; err.style.display='block'; } });
    }
    var champ=b.querySelector('[data-secret]'), zone=b.querySelector('.zone');
    var rempl=b.querySelector('[data-remplacer]'), ret=b.querySelector('[data-retirer]');
    var val=b.querySelector('[data-valider]');
    if(rempl) rempl.onclick=function(){ zone.classList.remove('hide'); champ.focus(); };
    if(ret)   ret.onclick=function(){
      if(confirm('Retirer cette clé ? Vos clients ne pourront plus payer par carte.')) deposer(null,null); };
    if(val)   val.onclick=function(){ deposer(champ.value,champ); };
    if(champ) champ.onkeydown=function(e){ if(e.key==='Enter') deposer(champ.value,champ); };
    if(champ && !zone) champ.onchange=function(){ if(champ.value) deposer(champ.value,champ); };
  });
}
function brancherIntegrations(){
  brancherSecrets();
  el('vue').querySelectorAll('[data-i]').forEach(function(b){
    var code=b.dataset.i, champ=b.querySelector('[data-v]'), err=b.querySelector('.integ-err');
    function ecrire(corps,input){
      if(err){ err.textContent=''; err.style.display='none'; }
      /* Un upsert : la ligne peut ne pas exister encore. */
      corps.hotel_id=HOTEL.id; corps.code=code;
      return api('/rest/v1/hotel_integrations',{method:'POST',body:corps,
          prefer:'resolution=merge-duplicates,return=representation'})
        .then(function(rows){ if(rows&&rows[0]) BRANCHE[code]=rows[0];
          flash(input,true); rendre(); })
        .catch(function(e){ flash(input,false);
          if(err){ err.textContent=e.message; err.style.display='block'; } });
    }
    if(champ) champ.onchange=function(){
      ecrire({valeur:champ.value.trim()||null, actif:true}, champ); };
    var on=b.querySelector('[data-on]');
    if(on) on.onchange=function(){ ecrire({valeur:(BRANCHE[code]||{}).valeur, actif:on.checked}, null); };
  });
}

/* Edition d'une ligne d'une table annexe : un PATCH par champ modifie. */
function ligne(table,id,champ,val,input,cache){
  var o={}; o[champ]=val;
  return api('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',body:o})
    .then(function(){ flash(input,true);
      (cache||[]).forEach(function(x){ if(x.id===id) x[champ]=val; }); })
    .catch(function(e){ flash(input,false); alert(e.message); });
}
function champsDe(hote,table,cache,apres){
  hote.querySelectorAll('[data-k]').forEach(function(i){
    i.onchange=function(){
      var v = i.type==='checkbox'?i.checked
            : i.type==='number'?(i.value===''?null:parseFloat(i.value))
            : (i.value.trim()||null);
      ligne(table,hote.dataset.x,i.dataset.k,v,i,cache);
      if(apres) apres(i,hote);
    };
  });
}
function emojiDe(hote,table,cache){
  hote.querySelectorAll('[data-emo]').forEach(function(t){
    t.onclick=function(){
      hote.querySelectorAll('[data-emo]').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on'); hote.querySelector('.em').textContent=t.dataset.emo;
      ligne(table,hote.dataset.x,'emoji',t.dataset.emo,null,cache);
    };
  });
}

function carteReco(r){

    +'<span class="nm">'+esc(r.nom||'Sans nom')+'</span>'
    +'<button class="rm" data-del="'+r.id+'">Supprimer</button></div>'

    +'<div><label>Nom</label><input data-k="nom" type="text" value="'+esc(r.nom||'')+'"></div>'

    +'<div><label>Distance</label><select data-k="trajet_mode">'

    +'<label>Lien Google Maps</label><input data-k="maps_url" type="text" placeholder="https://maps.app.goo.gl/…" value="'+esc(r.maps_url||'')+'">'
    +'<label>Icône</label><div class="emo">'+EMOJIS_LIEUX.map(function(e){

    +'</div>';
}
function brancherRecos(){
  el('vue').querySelectorAll('.item').forEach(function(b){

/* --- chambres et QR ---
   Un QR colle dans la chambre ouvre le livret avec le bon numero. Aucune
   integration, aucun logiciel : c'est ce qui marche chez tous les hoteliers. */
function blocChambres(){
  var l=CHAMBRES;
  return '<div class="bloc"><h3>Chambres et QR à afficher</h3>'
    +'<p class="integ-a" style="margin-bottom:12px">Imprimez ces codes et posez-les '
    +'dans les chambres. Le client scanne, son numéro est déjà rempli.</p>'
    +'<div class="qrs">'+l.map(function(c){
      return '<div class="qr-c"><img src="'+qrData(lienChambre(c),4)+'" alt="">'
        +'<b>'+esc(c.numero)+'</b><span class="qr-code">'+esc(c.code||'')+'</span>'
        +'<button class="rm" data-chsup="'+c.id+'">Retirer</button></div>'; }).join('')
    +(l.length?'':'<div class="integ-a">Aucune chambre pour le moment.</div>')+'</div>'
    +'<div class="ch-add"><input id="ch-num" type="text" placeholder="Numéro, ou 1-20 pour une série">'
    +'<button class="btn-2" id="ch-add">Ajouter</button></div>'
    +'<div class="integ-err" id="ch-err"></div>'
    +(l.length?'<button class="btn-2 imp" id="ch-imp" style="margin-top:12px">Imprimer les QR</button>':'')
    +'</div>';
}
function chargerChambres(){
  return api('/rest/v1/chambres?select=*&hotel_id=eq.'+HOTEL.id)
    .then(function(l){ CHAMBRES=(l||[]).sort(function(a,b){
      return String(a.numero).localeCompare(String(b.numero),'fr',{numeric:true}); }); });
}
function brancherChambres(){
  var v=el('vue'); if(!v.querySelector('#ch-add')) return;
  function erreur(m){ var e=el('ch-err'); if(e){ e.textContent=m; e.style.display=m?'block':'none'; } }
  v.querySelector('#ch-add').onclick=function(){
    var brut=(el('ch-num').value||'').trim(); if(!brut) return;
    var nums=[], serie=brut.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if(serie){
      var a=parseInt(serie[1],10), b=parseInt(serie[2],10);
      if(b<a || b-a>200) return erreur('Série trop large ou à l\'envers.');
      for(var n=a;n<=b;n++) nums.push(String(n));
    } else nums=[brut];
    var connues={}; CHAMBRES.forEach(function(c){ connues[String(c.numero)]=1; });
    var neuves=nums.filter(function(n){ return !connues[n]; })
                   .map(function(n){ return {hotel_id:HOTEL.id, numero:n}; });
    if(!neuves.length) return erreur('Ces chambres existent déjà.');
    erreur('');
    api('/rest/v1/chambres',{method:'POST',body:neuves})
      .then(chargerChambres).then(rendre)
      .catch(function(e){ erreur(e.message); });
  };
  v.querySelectorAll('[data-chsup]').forEach(function(b){
    b.onclick=function(){
      api('/rest/v1/chambres?id=eq.'+b.dataset.chsup,{method:'DELETE'})
        .then(chargerChambres).then(rendre).catch(function(e){ alert(e.message); });
    };
  });
  var imp=el('ch-imp');
  if(imp) imp.onclick=function(){
    document.body.classList.add('imp-qr');
    window.print();
    setTimeout(function(){ document.body.classList.remove('imp-qr'); },500);
  };
}

function jourEtat(j){

  return l||{jour:j,mode:'ferme'};

function jours(){

      +'<div class="'+(p?'':'hide')+'" data-precis="'+j+'">'

      +'<div class="hrs"><span>Soir</span><input type="time" data-h="'+j+'|soir_de" value="'+esc(e.soir_de||'')+'">'

      +'</div></div></div>';}).join('');

/* "07:00" -> "7h00", comme les horaires deja saisis dans le livret. */
function hhmm(t){ return t?t.replace(/^0/,'').replace(':','h'):''; }
function libelle(e){
  if(e.mode==='ferme') return 'Fermé';
  if(e.mode==='midi') return 'Le midi';
  if(e.mode==='soir') return 'Le soir';
  if(e.mode==='midi_soir') return 'Midi et soir';
  if(e.mode==='journee') return 'Toute la journée';
  var p=[];
  if(e.midi_de&&e.midi_a) p.push(hhmm(e.midi_de)+'-'+hhmm(e.midi_a));
  if(e.soir_de&&e.soir_a) p.push(hhmm(e.soir_de)+'-'+hhmm(e.soir_a));
  return p.length?p.join(' · '):'Fermé';
}
function brancherResto(){
  var v=el('vue');
  function collecte(){
    var l=JOURS.map(function(j){
      var e={jour:j, mode:v.querySelector('[data-jour="'+j+'"]').value};
      ['midi_de','midi_a','soir_de','soir_a'].forEach(function(k){
        var i=v.querySelector('[data-h="'+j+'|'+k+'"]'); if(i&&i.value) e[k]=i.value; });
      e.horaire=libelle(e); return e; });
    var o=HOTEL.restaurant||{}; o.jours=l;
    var ouverts=l.filter(function(x){return x.mode!=='ferme';}).map(function(x){return x.jour.slice(0,3);});
    sauver('restaurant',o,null);
    sauver('resto_horaires', ouverts.length?ouverts.join(', '):null, null);
  }
  v.querySelectorAll('[data-jour]').forEach(function(s){
    s.onchange=function(){
      v.querySelector('[data-precis="'+s.dataset.jour+'"]').classList.toggle('hide', s.value!=='precis');
      collecte(); };
  });
  v.querySelectorAll('[data-h]').forEach(function(i){ i.onchange=collecte; });
  v.querySelectorAll('[data-r]').forEach(function(i){
    i.onchange=function(){ var o=HOTEL.restaurant||{}; o[i.dataset.r]=i.value.trim()||null; sauver('restaurant',o,i); };
  });
}

function brancherPhotos(champ,bucket){
  var zone=el('vue').querySelector('[data-pics="'+champ+'"]'); if(!zone) return;
  zone.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){ var l=(HOTEL[champ]||[]).slice(); l.splice(+b.dataset.del,1);
      sauver(champ,l,null).then(rendre); };
  });
  zone.querySelector('[data-add]').onclick=function(){

    f.onchange=function(){ if(f.files&&f.files[0]) envoyer(f.files[0],champ,bucket); };
    f.click();
  };

function envoyer(fichier,champ,bucket){
  reduire(fichier).then(function(blob){
    var nom=HOTEL.id+'/'+Date.now()+'.jpg';
    return api('/storage/v1/object/'+bucket+'/'+nom,
      {method:'POST',raw:blob,type:'image/jpeg'}).then(function(){
        var url=SUPA+'/storage/v1/object/public/'+bucket+'/'+nom;
        var l=(HOTEL[champ]||[]).slice(); l.push(url);
        return sauver(champ,l,null).then(rendre); });
  }).catch(function(e){ alert('Envoi impossible : '+e.message); });
}
function reduire(fichier){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(fichier);
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?res(b):rej(new Error('conversion impossible')); },'image/jpeg',0.82);
    };
    img.onerror=function(){ rej(new Error('image illisible')); };
    img.src=url;
  });
}

/* Ce qui empeche encore le livret d'etre complet. On ne parle que des
   modules allumes : eteindre une section est une reponse valable. */
function aFaire(){
  var m=[];
  if(HOTEL.a_petit_dej && HOTEL.pdj_prix_adulte==null)
    m.push(['pdj','Indiquez le prix du petit-déjeuner, sans lui vos clients ne peuvent pas le commander']);
  if(HOTEL.a_petit_dej && !HOTEL.pdj_horaire) m.push(['pdj','Précisez les horaires du petit-déjeuner']);
  if(HOTEL.a_restaurant && !((HOTEL.restaurant||{}).jours||[]).some(function(j){return j.mode&&j.mode!=='ferme';}))
    m.push(['resto','Renseignez les horaires du restaurant']);
  if(HOTEL.a_late_checkout && HOTEL.late_prix==null)
    m.push(['lco','Fixez le supplément du départ tardif']);
  if(HOTEL.a_extras && !EXTRAS.filter(function(x){return x.actif!==false;}).length)
    m.push(['extras','Proposez au moins une petite attention']);
  if(HOTEL.a_recos && !RECOS.length) m.push(['recos','Ajoutez vos bonnes adresses']);
  if(!HOTEL.wifi_reseau) m.push(['etab','Renseignez le Wi-Fi, c\'est la première chose qu\'on cherche']);
  Object.keys(EQUIPS).forEach(function(t){
    var e=EQUIPEMENTS[t]||{};
    if(HOTEL['a_'+t] && !e.horaires && !e.description)
      m.push([t,'Décrivez '+(t==='spa'?'le spa':t==='sauna'?'le sauna':'la piscine')]);
  });
  if(!(BRANCHE.email_commandes||{}).valeur)
    m.push(['integ','Indiquez où recevoir vos commandes par email']);
  if(!m.length) return '';
  return '<div class="todo"><b>À compléter</b>'+m.map(function(x){
    return '<button data-go="'+x[0]+'">'+esc(x[1])+'</button>';}).join('')+'</div>';
}
var LIB={nouvelle:'Nouvelle',vue:'Vue',preparee:'Préparée',servie:'Servie',annulee:'Annulée'};
var NOUVELLES=0, MINUTEUR=null, VUES={};
function chargerCommandes(silencieux){
  return api('/rest/v1/commandes?select=*,commande_lignes(*)&order=created_at.desc&limit=60')
    .then(function(l){ l=l||[];
      var neuves=l.filter(function(c){ return c.statut==='nouvelle'; });
      /* Une commande arrivee pendant que l'onglet etait ailleurs : on previent. */
      neuves.forEach(function(c){ if(!VUES[c.id]){ VUES[c.id]=1; if(silencieux) prevenir(c); } });
      NOUVELLES=neuves.length; rendreOnglets();
      if(ONGLET==='cmd') rendreCommandes(l); })
    .catch(function(e){ var h=el('cmd-liste');
      if(h) h.innerHTML='<div class="vide">'+esc(e.message)+'</div>'; });
}
function prevenir(c){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    new Notification('Nouvelle commande · chambre '+(c.chambre||'?'),
      {body:c.total+' € · '+c.reference, tag:c.id});
  }catch(e){}
}
function suivre(){
  if(MINUTEUR) clearInterval(MINUTEUR);
  function battement(){
    if(document.hidden) return;
    chargerCommandes(true);
    if(HOTEL.a_petit_dej){ compterAPreparer(); if(ONGLET==='service') chargerService(); }
  }
  MINUTEUR=setInterval(battement,30000);
  document.addEventListener('visibilitychange',function(){ battement(); });
  if(HOTEL.a_petit_dej) compterAPreparer();
  try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
function rendreCommandes(l){
  if(!l.length){ el('cmd-liste').innerHTML='<div class="vide">Aucune commande pour le moment.<br>'
    +'Elles apparaîtront ici dès qu\'un client en passera une depuis son livret.</div>'; return; }
  el('cmd-liste').innerHTML=l.map(function(c){
    var d=new Date(c.created_at);
    var quand=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' à '
             +d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    var lignes=(c.commande_lignes||[]).map(function(x){
      var q=x.type==='pdj'?(x.nb_adulte+' adulte(s)'+(x.nb_enfant?', '+x.nb_enfant+' enfant(s)':'')):('x'+x.quantite);
      var quand=x.date_service
        ? new Date(x.date_service+'T00:00:00').toLocaleDateString('fr-FR',
            {weekday:'short',day:'numeric',month:'long'})
        : '';
      return '<div class="cmd-li">'+esc(x.libelle)+' · '+esc(q)
        +(quand?' · <strong>'+esc(quand)+'</strong>':'')
        +(x.heure_service?' à '+esc(x.heure_service):'')
        +' — '+x.total+' €</div>';}).join('');
    return '<div class="cmd '+(c.statut==='nouvelle'?'nouvelle':'')+'">'
      +'<div class="cmd-h"><span class="cmd-ch">Chambre '+esc(c.chambre||'?')+'</span>'
      +(c.chambre_verifiee===false?'<span class="tag doute-t">chambre à confirmer</span>':'')
      +'<span class="cmd-ref">'+esc(c.reference)+' · '+quand+'</span>'
      +'<span class="cmd-tot">'+c.total+' €</span></div>'+lignes
      +((c.nom||c.email)?'<div class="cmd-li" style="margin-top:6px">'
        +esc([c.nom,c.email].filter(Boolean).join(' · '))+'</div>':'')
      +'<div class="cmd-ft"><span class="tag '+esc(c.statut)+'">'+esc(LIB[c.statut]||c.statut)+'</span>'
      +((c.statut!=='servie'&&c.statut!=='annulee')
        ? '<button class="btn-2" data-st="preparee" data-id="'+c.id+'">Préparée</button>'
          +'<button class="btn-2" data-st="servie" data-id="'+c.id+'">Servie</button>'
          +'<button class="btn-2" data-st="annulee" data-id="'+c.id+'">Annuler</button>':'')
      +'<span style="margin-left:auto;font-size:12.5px;color:var(--ink-3)">à régler sur place</span>'
      +'</div></div>';}).join('');
  el('cmd-liste').querySelectorAll('[data-st]').forEach(function(b){
    b.onclick=function(){ b.disabled=true;
      api('/rest/v1/commandes?id=eq.'+b.dataset.id,{method:'PATCH',
        body:{statut:b.dataset.st,updated_at:new Date().toISOString()}})
        .then(chargerCommandes).catch(function(e){ alert(e.message); b.disabled=false; }); };
  });
}

demarrer();
</script>
